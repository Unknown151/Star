.chip.on .dia{color:inherit}
:root[data-theme="light"] .chip{background:#fff;color:var(--text);border-color:var(--line2)}
:root[data-theme="light"] .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:none}
:root[data-theme="light"] .chip.on small{color:#fff}

/* fields */
select,input[type=number],input[type=text],input[type=search],textarea{background:var(--field);color:var(--hi);border:1px solid var(--line2);border-radius:2px;padding:7px 9px;box-shadow:inset 0 0 10px rgba(0,0,0,.55)}
:is(select,input,textarea):focus{outline:none;border-color:var(--accent);box-shadow:0 0 10px var(--glow),inset 0 0 10px rgba(0,0,0,.4)}
select{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:var(--chev);background-repeat:no-repeat;background-position:right 10px center;max-width:100%}
select option{background:var(--panel2);color:var(--text)}
input[type=number]{width:96px}
:root[data-theme="light"] :is(select,input,textarea){box-shadow:none}

/* app bar */
.appbar{display:flex;align-items:center;gap:10px;max-width:820px;margin:0 auto;padding:12px 12px 8px}
.brand{font-stretch:125%;font-weight:800;text-transform:uppercase;letter-spacing:.09em;font-size:18px;white-space:nowrap;
  background:linear-gradient(180deg,#fff 0%,#d4e6ff 44%,#6c8bb5 52%,#e6f1ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 6px rgba(var(--accent-rgb),.55))}
.brand b{font-weight:800;background:linear-gradient(180deg,#fff,var(--accent) 60%,color-mix(in srgb,var(--accent) 50%,#000));-webkit-background-clip:text;background-clip:text}
:root[data-theme="light"] .brand{background:none;color:var(--hi);filter:none}
:root[data-theme="light"] .brand b{background:none;color:var(--accent)}
#listName{flex:1;min-width:0;background:transparent;border:1px solid transparent;box-shadow:none;padding:6px 8px;font-weight:600;font-size:16px;color:var(--hi)}
#listName:hover,#listName:focus{border-color:var(--line2);background:var(--field)}

/* budget bar */
/* title bar, budget bar and tabs stay pinned together */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,rgba(4,9,20,.97),rgba(3,7,16,.96));box-shadow:0 1px 0 rgba(var(--accent-rgb),.14),0 8px 22px rgba(0,0,0,.55);backdrop-filter:blur(6px)}
:root[data-theme="light"] .top{background:rgba(244,246,249,.97);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.budget{background:linear-gradient(180deg,rgba(5,12,26,.97),rgba(3,8,18,.95));border-top:1px solid var(--line);border-bottom:1px solid var(--line2)}
:root[data-theme="light"] .budget{background:#fff}
.budget .in{max-width:820px;margin:0 auto;padding:7px 12px;display:grid;grid-template-columns:1fr 1fr auto;gap:6px}
.meter{position:relative;background:var(--field);border:1px solid var(--line2);border-radius:2px;padding:3px 9px 5px;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0;box-shadow:inset 0 0 12px rgba(0,0,0,.6)}
.meter .fill{position:absolute;left:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--accent),rgb(var(--accent2-rgb)));box-shadow:0 0 6px var(--glow);transition:width .2s}
.meter .k{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-stretch:115%}
.meter .v{font-weight:700;white-space:nowrap;color:var(--hi);text-shadow:var(--tglow);font-size:15.5px}
.meter small{color:var(--muted);font-weight:500;text-shadow:none}
.meter .k .ks,.probs .short{display:none}
.meter.bad{border-color:var(--bad)} .meter.bad .fill{background:var(--bad)} .meter.bad .v{color:var(--bad);text-shadow:0 0 8px rgba(255,93,77,.6)}
:root[data-theme="light"] .meter{box-shadow:none}
.ico{display:inline-block;flex:none}
.ico-min{width:10px;height:12px;clip-path:polygon(50% 0,100% 32%,82% 100%,18% 100%,0 32%);background:linear-gradient(135deg,#dff4ff,#46a8f0 45%,#1a56a8)}
.ico-gas{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d6ffbe,#46c63e 55%,#145c18);box-shadow:0 0 6px rgba(90,220,80,.55)}
.probs{border-radius:2px;border:1px solid rgba(91,227,138,.5);background:rgba(91,227,138,.08);font-weight:700;padding:3px 12px;white-space:nowrap;color:var(--ok);text-transform:uppercase;letter-spacing:.06em;font-stretch:115%;font-size:13px;text-shadow:0 0 8px rgba(91,227,138,.55)}
.probs.bad{color:#fff;background:linear-gradient(180deg,#b3261b,#7a140d);border-color:#ff7a6c;box-shadow:0 0 12px rgba(255,80,60,.45);text-shadow:0 0 6px rgba(255,120,100,.8)}
:root[data-theme="light"] .probs{text-shadow:none}
.slotline{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.sc{display:inline-flex;gap:5px;align-items:baseline;padding:2px 8px;border-radius:2px;background:var(--field);border:1px solid var(--line);border-left:3px solid var(--c);font-size:13px;white-space:nowrap;color:var(--muted)}
.sc b{font-weight:700;color:var(--text)}
.sc.zero{opacity:.45}
.sc.over{border-color:var(--bad);color:var(--bad)} .sc.over b{color:var(--bad)}
.sc.full b{color:var(--c);text-shadow:0 0 6px var(--c)}
:root[data-theme="light"] .sc.full b{text-shadow:none}
.resn{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.resn b{color:var(--hi);text-shadow:var(--tglow)}

/* tab bar */
.tabbar{background:linear-gradient(180deg,rgba(10,22,44,.92),rgba(4,10,22,.95));border-bottom:1px solid var(--line2)}
:root[data-theme="light"] .tabbar{background:transparent}
.tabs{max-width:820px;margin:0 auto;padding:0 6px;display:flex;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:none;padding:12px 14px 11px;color:color-mix(in srgb,var(--head) 70%,var(--muted));font-weight:600;white-space:nowrap;text-transform:uppercase;letter-spacing:.07em;font-stretch:122%;font-size:13.5px}
.tabs button:hover{color:var(--hi)}
.tabs button[aria-selected="true"]{color:#fff;text-shadow:0 0 10px rgba(var(--accent-rgb),.9);
  background:linear-gradient(90deg,var(--accent),rgb(var(--accent2-rgb))) bottom/100% 2px no-repeat,linear-gradient(180deg,transparent,rgba(var(--accent-rgb),.2))}
:root[data-theme="light"] .tabs button[aria-selected="true"]{color:var(--hi);background:linear-gradient(90deg,var(--accent),rgb(var(--accent2-rgb))) bottom/100% 2px no-repeat}

main{max-width:820px;margin:0 auto;padding:14px 12px 40px}
.card{padding:12px 14px;margin:0 0 12px}
.card h3,.group h3{margin:0 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.11em;font-stretch:125%;color:var(--head);display:flex;gap:8px;align-items:baseline;font-weight:700}
.card h3 .r,.group h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-stretch:100%;font-weight:600;color:var(--muted);font-size:13px}

/* setup */
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{padding:7px 13px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-stretch:118%;color:color-mix(in srgb,var(--head) 80%,#fff)}
.seg button small{font-weight:500;opacity:.8;letter-spacing:.02em}
.setup{display:grid;gap:12px}
.setup .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:11.5px;color:var(--head);text-transform:uppercase;letter-spacing:.1em;font-stretch:120%;min-width:66px;font-weight:600}
.facinfo{font-size:13px;color:var(--muted)}

/* problems */
.problems ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.problems li{padding:7px 10px;border-radius:2px;background:linear-gradient(90deg,rgba(255,93,77,.16),rgba(255,93,77,.04));border-left:3px solid var(--bad);color:var(--hi)}
.problems li.note{background:linear-gradient(90deg,rgba(255,197,82,.13),rgba(255,197,82,.03));border-left-color:var(--warn)}
.problems .legal{color:var(--ok);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-stretch:120%;text-shadow:0 0 8px rgba(91,227,138,.5)}
:root[data-theme="light"] .problems .legal{text-shadow:none}

/* unit rows */
.group{margin:0 0 16px}
.group h3{padding:0 2px;font-size:13px}
.unit{--b:8px;margin:0 0 8px;padding:10px 12px 10px 15px}
.unit::after{content:"";position:absolute;left:1px;top:calc(var(--b) + 1px);bottom:calc(var(--b) + 1px);width:3px;background:var(--c);box-shadow:0 0 8px var(--c)}
.unit.err{background:linear-gradient(170deg,#ff7a6c,rgba(255,93,77,.35) 35%,rgba(255,93,77,.25) 70%,#ff7a6c)}
.unit.err::after{background:var(--bad)}
.unit header{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.unit h4{margin:0;font-size:16px;flex:1;min-width:0;font-weight:600;color:var(--hi);font-stretch:108%}
.unit .cost{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:16px;color:var(--hi);text-shadow:var(--tglow)}
.unit .tw{color:var(--head);transition:transform .15s;font-size:11px}
.unit.open .tw{transform:rotate(180deg)}
.badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:2px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);white-space:nowrap;text-transform:uppercase;letter-spacing:.07em;font-stretch:115%}
.tag{font-size:10.5px;padding:1px 6px;border-radius:2px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tag.uq{border-color:color-mix(in srgb,var(--warn) 60%,transparent);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip.size{border-radius:2px}
.uerr{color:var(--bad);font-size:13px;margin-top:6px}
.loadline{font-size:13px;margin-top:7px;color:var(--muted)}
.loadline b{color:var(--text);font-weight:600}
.add{width:100%;padding:12px;text-transform:uppercase;letter-spacing:.12em;font-stretch:122%;font-size:13px;color:var(--head)}
.empty{color:var(--muted);text-align:center;padding:18px 8px;text-transform:uppercase;letter-spacing:.08em;font-size:13px}

/* datasheet */
.sheet{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:10px}
.sheet .meta{font-size:13px;color:var(--muted)}
.tw-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
.stats th,.stats td,.weapons th,.weapons td{padding:4px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.stats th,.weapons th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--head);font-weight:600;font-stretch:115%}
.stats td{font-weight:700;font-size:17px;color:var(--hi)}
.weapons td{font-size:13.5px}
.weapons td:first-child,.weapons th:first-child{text-align:left}
.weapons td.kw{text-align:left;white-space:normal;min-width:150px;font-size:12.5px}
.weapons tr.cc td:first-child::after{content:" ⚔";color:var(--muted);font-size:11px}
td.mod,span.mod,.stats td.mod{color:var(--mod);text-shadow:0 0 8px color-mix(in srgb,var(--mod) 50%,transparent)}
:root[data-theme="light"] :is(td.mod,span.mod){text-shadow:none}
.wsrc{display:block;font-size:11px;color:var(--muted);font-weight:400;text-shadow:none}
.abl{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:14px}
.abl li b{font-weight:700;color:var(--hi)}
.abl .t{font-size:11.5px;color:var(--muted);margin-left:4px}
.abl .u{font-size:10px;font-weight:700;color:var(--head);border:1px solid currentColor;border-radius:2px;padding:0 4px;margin-left:5px;text-transform:uppercase;letter-spacing:.05em}
.abl .n{display:block;font-size:12.5px;color:var(--warn)}
.uactions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* cards section */
.crow{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.crow:first-of-type{border-top:none}
.crow .nm{flex:1;min-width:140px;font-weight:600;cursor:pointer;color:var(--hi)}
.crow .nm small{font-weight:400}
.sg{font-size:11px;padding:1px 7px;border-radius:2px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);white-space:nowrap;font-weight:700}
.gas{font-weight:700;min-width:44px;text-align:right;color:var(--hi)}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{width:30px;height:28px;padding:0;font-size:16px}
.step span{min-width:22px;text-align:center;font-weight:700;color:var(--hi)}
.cabl{flex-basis:100%;font-size:13px;color:var(--muted);padding-left:2px}
.cabl b{color:var(--text)}

/* plan */
.plan th,.plan td{padding:6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.plan th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--head);font-stretch:115%}
.plan td.num{text-align:right;font-weight:700;white-space:nowrap;color:var(--hi)}
.plan tr.over td{color:var(--bad)}
.prow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.prow .nm{flex:1;min-width:150px}
.rsel{display:inline-flex;gap:4px;flex-wrap:wrap}
.rsel button{padding:4px 9px;font-size:12px}
.rsel button.no{opacity:.4}

/* roster */
pre.roster{white-space:pre-wrap;background:var(--field);border:1px solid var(--line2);border-radius:2px;padding:12px;font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;margin:0;overflow-x:auto;color:var(--text);box-shadow:inset 0 0 14px rgba(0,0,0,.5)}
:root[data-theme="light"] pre.roster{box-shadow:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,3,9,.74);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.modal{align-items:center}}
.panel{--b:14px;width:100%;max-width:680px;max-height:92vh;display:flex;flex-direction:column}
@media (min-width:700px){.panel{max-height:86vh}}
.panel .ph{padding:14px 16px 10px;border-bottom:1px solid var(--line2);display:grid;gap:8px}
.panel .ph .top{display:flex;align-items:center;gap:8px}
.panel .ph h2{margin:0;font-size:16px;flex:1;text-transform:uppercase;letter-spacing:.1em;font-stretch:125%;color:var(--hi);text-shadow:var(--tglow)}
.panel .pb{overflow-y:auto;padding:6px 16px 18px;-webkit-overflow-scrolling:touch}
.pick{padding:10px 0;border-bottom:1px solid var(--line)}
.pick .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pick .nm{font-weight:700;flex:1;min-width:150px;cursor:pointer;color:var(--hi)}
.pick.dim .nm{opacity:.5}
.pick .why{font-size:12.5px;color:var(--warn)}
.pick .opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pick h4{margin:14px 0 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--head);font-stretch:120%}
.lrow{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lrow .nm{flex:1;min-width:160px}
.lrow.cur .nm b{color:var(--head);text-shadow:var(--tglow)}

.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--panel);color:var(--hi);border:1px solid var(--accent);box-shadow:0 0 16px var(--glow);padding:8px 16px;border-radius:2px;font-weight:600;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;text-shadow:var(--tglow)}
.toast.show{opacity:1}

/* keyword popups */
.kwt{border-bottom:1px dotted currentColor;cursor:help}
.kwt:hover,.kwt:focus-visible{color:var(--hi);border-bottom-style:solid;outline:none}
.pill[data-kw]{cursor:help}
#kwtip{position:fixed;z-index:80;max-width:min(320px,calc(100vw - 16px));padding:8px 11px;background:var(--panel);color:var(--text);border:1px solid var(--accent);border-radius:3px;box-shadow:0 6px 24px rgba(0,0,0,.5),0 0 12px var(--glow);font-size:13.5px;line-height:1.45;pointer-events:none}
#kwtip[hidden]{display:none}
#kwtip b{color:var(--hi);text-transform:uppercase;letter-spacing:.04em;margin-right:6px}
#kwtip small{color:var(--muted);font-size:11px}
#kwtip div{margin-top:3px}

footer{max-width:820px;margin:0 auto;padding:18px 12px 40px;color:var(--faint);font-size:12.5px;border-top:1px solid var(--line)}
footer p{margin:4px 0}

/* card-style datasheet */
.dcard{padding:12px 14px}
.dcard.embedded{margin-top:10px;padding:10px 0 0;border-top:1px solid var(--line)}
.dcard.card{padding-left:17px}
.dcard.card::after{content:"";position:absolute;left:1px;top:calc(var(--b) + 1px);bottom:calc(var(--b) + 1px);width:3px;background:var(--c);box-shadow:0 0 8px var(--c)}
.dcard.closed{margin-bottom:8px;padding-top:10px;padding-bottom:10px}
.dcard.closed .dc-head{margin-bottom:0}
.dc-head.tog{cursor:pointer;user-select:none;align-items:center}
.dc-head .tw{color:var(--head);font-size:11px;transition:transform .15s}
.dcard.open .dc-head .tw{transform:rotate(180deg)}
.dc-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.dc-name{flex:1;min-width:0}
.dc-name h3{margin:0;font-size:19px;line-height:1.2;text-transform:uppercase;letter-spacing:.05em;font-stretch:118%;color:var(--hi);text-shadow:var(--tglow);font-weight:700}
.dc-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.dc-head .cost{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:18px;color:var(--hi);text-shadow:var(--tglow)}
.dc-top{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;justify-content:space-between}
.dc-stats{display:flex;gap:5px;flex-wrap:wrap}
.st{min-width:56px;padding:5px 5px 4px;text-align:center;border:1px solid rgba(var(--accent-rgb),.6);border-radius:3px;background:linear-gradient(180deg,rgba(var(--accent-rgb),.3),rgba(var(--accent-rgb),.06));box-shadow:inset 0 0 10px rgba(var(--accent-rgb),.22)}
.st b{display:block;font-size:23px;line-height:1.05;font-weight:700;color:var(--hi);text-shadow:var(--tglow)}
.st span{display:block;margin-top:2px;font-size:8.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--head);white-space:nowrap}
.st.mod{border-color:var(--mod)} .st.mod b{color:var(--mod)}
.st.long b{font-size:18px;line-height:1.35}
.st b small{display:block;font-size:9px;line-height:1.2;font-weight:600;color:var(--muted);text-shadow:none;white-space:nowrap}
.msup{text-align:center}
.msrow{display:flex;gap:4px}
.ms{min-width:42px;border:1px solid var(--line2);border-radius:3px;overflow:hidden;background:var(--field)}
.ms span{display:block;padding:2px 6px 1px;font-weight:700;font-size:15px;color:var(--text)}
.ms b{display:block;padding:0 6px 1px;font-size:13px;background:rgba(var(--accent-rgb),.22);color:var(--hi)}
.ms.cur{border-color:var(--accent);box-shadow:0 0 10px var(--glow)}
.ms.cur b{background:var(--accent);color:#06101c}
.msup small{display:block;margin-top:3px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.dc-load{margin-top:10px;font-size:13px;color:var(--muted);display:grid;gap:1px}
.dc-load b{color:var(--text);font-weight:600}
.dc-ph{position:relative;margin-top:16px;padding:16px 10px 6px;border:1px solid rgba(var(--accent-rgb),.4);border-radius:3px;background:linear-gradient(180deg,rgba(var(--accent-rgb),.07),transparent 60px)}
.dc-ph>h4{position:absolute;top:-10px;left:8px;margin:0;padding:2px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-stretch:120%;background:var(--accent);color:#06101c;border-radius:2px;box-shadow:0 0 10px var(--glow)}
.dc-ph .weapons{margin-bottom:4px}
.ab{margin:6px 0;font-size:14px;line-height:1.5}
.ab>b{text-transform:uppercase;letter-spacing:.02em;color:var(--hi);font-weight:700}
.abn{display:block;font-size:12.5px;color:var(--warn)}
.pill{display:inline-block;margin-right:3px;padding:1px 5px;border-radius:2px;font-size:10px;font-weight:800;line-height:1.4;letter-spacing:.05em;text-transform:uppercase;vertical-align:1px;color:#fff}
.pill.k-active{background:#2b7bd0}
.pill.k-reaction{background:#d4850a}
.pill.k-passive{background:#c2262f}
.pill.cst{background:#23963f}

<body>
<div class="top" id="top">
<header class="appbar">
  <div class="brand">Supply <b>Line</b></div>
  <input id="listName" data-act="rename" aria-label="List name" autocomplete="off" spellcheck="false">
  <button class="btn" data-act="lists">Lists</button>
</header>
<div class="budget" id="bar"></div>
<nav class="tabbar"><div class="tabs" role="tablist">
  <button role="tab" data-act="tab" data-tab="army">Army</button>
  <button role="tab" data-act="tab" data-tab="build">Build</button>
  <button role="tab" data-act="tab" data-tab="play">Cards</button>
  <button role="tab" data-act="tab" data-tab="plan">Supply</button>
  <button role="tab" data-act="tab" data-tab="roster">Roster</button>
</div></nav>
</div>
<main id="view"></main>
<footer>
  <p><b>Unofficial fan tool.</b> Not affiliated with Blizzard Entertainment or Archon Studio. StarCraft is a trademark of Blizzard Entertainment.</p>
  <p>Official rules, cards and points: <a href="https://starcraft-tmg.com/downloads" target="_blank" rel="noopener">starcraft-tmg.com/downloads</a> · Ability text here is paraphrased — the printed cards win.</p>
  <p id="dataver"></p>
</footer>
<div id="modal"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="kwtip" role="tooltip" hidden></div>
<div id="print"></div>

<script id="engine">
/* ─────────────────────────────────────────────────────────────────────────
   ENGINE — pure list logic, no DOM. Exercised by test/run-tests.mjs.
   ───────────────────────────────────────────────────────────────────────── */
const Engine = (() => {
  const SLOTS = ['core', 'elite', 'support', 'air', 'hero'];
  const SLOT_NAME = { core:'Core', elite:'Elite', support:'Support', air:'Air', hero:'Hero' };
  const U = {}, F = {}, C = {};
  GAME.units.forEach(u => { U[u.id] = u; });
  GAME.factions.forEach(f => { F[f.id] = f; });
  GAME.cards.forEach(c => { C[c.id] = c; });

  const fmt = n => n === Infinity ? '∞' : Number(n).toLocaleString('en-US');
  const joinList = (a, word) => a.length < 2 ? a.join('') : `${a.slice(0, -1).join(', ')} ${word} ${a[a.length - 1]}`;
  const orList = a => joinList(a, 'or');
  const andList = a => joinList(a, 'and');
  const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);

  // ── weapons ──
  const DASH = v => (!v || v === '–' || v === '-') ? '–' : v;
  const wcache = new Map();
  function weapon(s) {
    if (!wcache.has(s)) {
      const [name, rng, tgt, roa, hit, surge, sd, dmg, kw] = s.split('|').map(x => x.trim());
      wcache.set(s, { name, rng, tgt, roa, hit, surge: DASH(surge), sd: DASH(sd), dmg, cc: rng === 'E',
        kw: DASH(kw) === '–' ? [] : kw.split(/,\s*/) });
    }
    const w = wcache.get(s);
    return { ...w, kw: [...w.kw] };
  }
  // "LONG RANGE (16″)" replaces an existing LONG RANGE; conditional text ("… within 8″") is appended.
  function addKw(w, kw) {
    const m = kw.match(/^([A-Z][A-Z\- ]*?)\s*\([^)]*\)$/);
    w.newKw = w.newKw || [];
    if (m) {
      const i = w.kw.findIndex(k => k === m[1] || k.startsWith(m[1] + ' ('));
      if (i >= 0) { w.kw[i] = kw; w.newKw.push(kw); return; }
    }
    w.kw.push(kw); w.newKw.push(kw);
  }

  // ── scale ──
  function scaleInfo(list) {
    const s = GAME.scales[list.scale] || GAME.scales.standard;
    const limit = list.scale === 'grand' ? Math.max(0, Math.round(Number(list.limit) || s.limit)) : s.limit;
    return { ...s, key: GAME.scales[list.scale] ? list.scale : 'standard', limit, gasLimit: Math.floor(limit * GAME.gasRatio) };
  }

  // ── one list entry ──
  const upCost = (up, si) => Array.isArray(up.c) ? up.c[Math.min(Math.max(si, 0), up.c.length - 1)] : (up.c || 0);
  function label(def, n) {
    if (!def) return 'Unknown unit';
    return def.sizes.some(s => s[0] > 1) ? `${def.plural || def.name + 's'} ×${n}` : def.name;
  }
  function entry(e) {
    const def = U[e.id];
    if (!def) return { e, def: null, label: `Unknown unit “${e.id}”`, cost: 0, supply: 0, poolSupply: 0, ups: [], unknown: [] };
    let si = def.sizes.findIndex(s => s[0] === e.n);
    const validSize = si >= 0;
    if (!validSize) {   // price an illegal size at the nearest legal one, and flag it
      si = def.sizes.reduce((b, s, i) => Math.abs(s[0] - e.n) < Math.abs(def.sizes[b][0] - e.n) ? i : b, 0);
    }
    const [, base, supply] = def.sizes[si];
    const all = def.upgrades || [];
    const ups = [], unknown = [];
    (e.up || []).forEach(n => { const u = all.find(x => x.n === n); if (u) { if (!ups.includes(u)) ups.push(u); } else unknown.push(n); });
    ups.sort((a, b) => all.indexOf(a) - all.indexOf(b));
    const upg = ups.reduce((a, u) => a + upCost(u, si), 0);
    const pool0 = ups.some(u => (u.fx || []).some(f => f.pool0));
    return { e, def, si, validSize, models: e.n, base, upg, cost: base + upg, supply, poolSupply: pool0 ? 0 : supply,
      ups, unknown, dupUps: (e.up || []).length - new Set(e.up || []).size, label: label(def, e.n) };
  }

  // ── validation ──
  function evaluate(list) {
    const race = GAME.races[list.race];
    const fac = F[list.faction] && F[list.faction].race === list.race ? F[list.faction] : null;
    const sc = scaleInfo(list);
    const ev = { list, race, fac, scale: sc, entries: [], cards: [], minerals: 0, gas: 0, res: 0, resBy: [],
      used: {}, prov: {}, provBy: {}, errors: [], notes: [] };
    SLOTS.forEach(t => { ev.used[t] = 0; ev.prov[t] = 0; ev.provBy[t] = []; });
    const err = (msg, ref) => ev.errors.push({ msg, ref: ref || null });
    const note = (msg, ref) => ev.notes.push({ msg, ref: ref || null });
    const provide = (name, slots) => SLOTS.forEach(t => {
      const n = (slots || {})[t] || 0; if (!n) return;
      ev.prov[t] += n;
      const p = ev.provBy[t].find(x => x.name === name);
      p ? p.n += n : ev.provBy[t].push({ name, n });
    });
    const addRes = (name, n) => { ev.res += n; const r = ev.resBy.find(x => x.name === name); r ? r.n += n : ev.resBy.push({ name, n }); };

    if (!race) err('Pick a race.');
    if (!fac) err('Pick a Faction card.');
    else { provide(fac.name, fac.slots); addRes(fac.name, fac.res); }

    (list.cards || []).forEach(id => {
      const c = C[id];
      if (!c) { err(`Unknown card “${id}” — remove it.`, 'cards'); return; }
      ev.cards.push(c);
      ev.gas += c.gas;
      if (c.res) addRes(c.name, c.res);
      provide(c.name, c.slots);
    });

    (list.units || []).forEach(e => {
      const x = entry(e);
      ev.entries.push(x);
      if (!x.def) { err(`Unknown unit “${e.id}” — remove it.`, e.uid); return; }
      ev.minerals += x.cost;
      if (!x.def.summoned) ev.used[x.def.slot] += x.supply;
    });

    const facHas = tags => !fac || (tags || []).every(t => fac.tags.includes(t));
    const needs = (name, tags) => {
      const fs = GAME.factions.filter(f => f.race === list.race && tags.every(t => f.tags.includes(t))).map(f => f.name);
      return fs.length ? `${name} needs the ${orList(fs)} faction card.` : `${name} can't be taken by ${fac.name}.`;
    };

    // budget
    if (ev.minerals > sc.limit) err(`${fmt(ev.minerals - sc.limit)} Minerals over the ${fmt(sc.limit)} limit.`, 'minerals');
    if (sc.key === 'grand' && sc.limit < GAME.scales.grand.min)
      err(`Grand Offensive starts at ${fmt(GAME.scales.grand.min)} Minerals — raise the limit or pick Standard.`, 'scale');
    if (ev.gas > sc.gasLimit) err(`${fmt(ev.gas - sc.gasLimit)} Gas over the ${fmt(sc.gasLimit)} limit (Gas is 10% of the Mineral limit).`, 'gas');

    // units
    ev.entries.forEach(x => {
      if (!x.def) return;
      const d = x.def, ref = x.e.uid;
      if (race && d.race !== list.race) err(`${d.name} isn't a ${race.name} unit.`, ref);
      else if (d.summoned) err(`${d.name} is summoned during the game (${d.by}) — it can't be bought. Remove it.`, ref);
      else if (fac && !facHas(d.tags)) err(needs(d.name, d.tags), ref);
      if (!x.validSize) err(`${d.name} can't be fielded as ${x.models} — legal sizes: ${orList(d.sizes.map(s => String(s[0])))} models.`, ref);
      x.unknown.forEach(n => err(`${x.label}: unknown upgrade “${n}”.`, ref));
      if (x.dupUps) err(`${x.label}: the same upgrade is listed twice.`, ref);
      const spec = x.ups.filter(u => u.sp);
      if (spec.length > x.models) err(`${x.label}: ${spec.length} Specialist upgrades but only ${x.models} model${x.models > 1 ? 's' : ''} — each needs its own model.`, ref);
      const reps = {};
      x.ups.filter(u => u.rep && !u.sp).forEach(u => { (reps[u.rep] = reps[u.rep] || []).push(u.n); });
      Object.entries(reps).forEach(([w, ns]) => { if (ns.length > 1) err(`${x.label}: ${andList(ns)} all replace ${w} — pick one.`, ref); });
      (d.abilities || []).forEach(a => { if (a[3]) note(`${d.name} — ${a[0]}: ${a[3]}`, ref); });
    });

    // unique units
    const seen = {};
    ev.entries.forEach(x => { if (x.def && x.def.unique) (seen[x.def.id] = seen[x.def.id] || []).push(x); });
    Object.values(seen).forEach(xs => { if (xs.length > 1) err(`${xs[0].def.name} is Unique — you have ${xs.length}; keep one.`, xs[xs.length - 1].e.uid); });
    // mutually exclusive profiles (Nova)
    const excl = {};
    ev.entries.forEach(x => { if (x.def && x.def.excl) (excl[x.def.excl] = excl[x.def.excl] || new Set()).add(x.def.name); });
    Object.values(excl).forEach(s => { if (s.size > 1) err(`Only one of ${orList([...s])} per army.`); });

    // cards
    const cardCount = {};
    ev.cards.forEach(c => { cardCount[c.id] = (cardCount[c.id] || 0) + 1; });
    Object.entries(cardCount).forEach(([id, n]) => {
      const c = C[id];
      if (race && c.race !== list.race) err(`${c.name} isn't a ${race.name} card.`, 'cards');
      else if (fac && c.tags && !facHas(c.tags)) err(needs(c.name, c.tags), 'cards');
      if (c.unique && n > 1) err(`${c.name} is Unique — only one copy allowed.`, 'cards');
    });
    if (race && race.needsCreep) {
      const n = ev.cards.filter(c => c.kind === 'creep').length;
      if (n === 0) err('Zerg armies need exactly one Creep card — Accelerating Creep (0 Gas) works with any faction.', 'creep');
      if (n > 1) err(`Only one Creep card allowed — you have ${n}.`, 'creep');
    }

    // slots
    SLOTS.forEach(t => { const short = ev.used[t] - ev.prov[t]; if (short > 0) err(slotMsg(t, short, list, ev), 'slot-' + t); });

    if (sc.key === 'grand') note('No mission card lists Grand Offensive Supply values — the Supply plan uses the Standard ones.');
    ev.legal = ev.errors.length === 0;
    return ev;
  }

  // "2 Elite slots short — Lair, Overlord or Hydralisk Den would add Elite."
  function slotMsg(t, short, list, ev) {
    const name = SLOT_NAME[t];
    let msg = `${short} ${name} slot${short > 1 ? 's' : ''} short`;
    if (ev.fac && !ev.fac.slots[t]) msg += ` — ${ev.fac.name} has no ${name} slots`;
    const taken = new Set((list.cards || []).filter(id => C[id] && C[id].unique));
    const gasLeft = ev.scale.gasLimit - ev.gas;
    const fits = c => c.gas <= gasLeft ? 1 : 0;
    const cands = GAME.cards.filter(c => c.race === list.race && c.kind !== 'creep' && (c.slots[t] || 0) > 0 && !taken.has(c.id)
      && (!c.tags || !ev.fac || c.tags.every(tag => ev.fac.tags.includes(tag))));
    if (!cands.length) return msg + (t === 'air' ? '; no card adds Air slots yet.' : `; no available card adds ${name}.`);
    cands.sort((a, b) => (fits(b) - fits(a)) || (Math.min(b.slots[t], short) - Math.min(a.slots[t], short))
      || (b.res - a.res) || (a.gas - b.gas) || a.name.localeCompare(b.name));
    const top = cands.slice(0, 3);
    msg += `${ev.fac && !ev.fac.slots[t] ? ';' : ' —'} ${orList(top.map(c => c.name))} would add ${name}`;
    msg += fits(top[0]) ? '.' : ` (you're short on Gas, so swap out another card).`;
    return msg;
  }

  // ── ability timing: "Assault · Reaction · 1 CP · Once per Game" → phase, kind, cost, extras ──
  const PHASES = ['Any', 'Movement', 'Assault', 'Combat', 'Scoring'];
  function timing(t) {
    const parts = String(t || '').split(' · ').map(p => p.trim()).filter(Boolean);
    const phase = PHASES.includes(parts[0]) ? parts.shift() : 'Any';
    let kind = 'Passive', cost = '';
    const extra = [];
    parts.forEach(p => {
      if (/^(Active|Reaction|Passive)$/.test(p)) kind = p;
      else if (/^[\dX][\d–-]*\s*(CP|BM|PE)$/.test(p)) cost = p;
      else extra.push(p);
    });
    return { phase, kind, cost, extra };
  }
  // "1–3 → 0 · 4–6 → 1" → boxes, marking the bracket the squad starts in
  function supplyProfile(def, n) {
    return String(def.supply).split(' · ').map(seg => {
      const [m, sup] = seg.includes('→') ? seg.split('→').map(v => v.trim()) : ['1', seg.trim()];
      const [lo, hi] = m.split(/[–-]/).map(Number);
      return { models: m.replace('–', '-'), supply: sup, cur: n >= lo && n <= (hi || lo) };
    });
  }

  // ── effective datasheet (whole-unit upgrades applied; Specialist weapons listed separately) ──
  function effective(x) {
    const d = x.def;
    const stats = { ...d.stats }, mod = {};
    const whole = x.ups.filter(u => !u.sp), spec = x.ups.filter(u => u.sp);
    const weapons = (d.weapons || []).map(s => weapon(s));
    whole.forEach(u => {
      if (!u.w) return;
      const w = { ...weapon(u.w), src: u.n };
      const i = u.rep ? weapons.findIndex(v => v.name === u.rep) : -1;
      if (i >= 0) { w.replaced = u.rep; weapons[i] = w; } else weapons.push(w);
    });
    spec.forEach(u => { if (u.w) weapons.push({ ...weapon(u.w), src: u.n, spec: true, replaces: u.rep || null }); });
    // the unit's own upgrade effects, plus (for a summoned unit) effects from its parent's upgrades
    const fxs = whole.flatMap(u => (u.fx || []).filter(f => !f.unit).map(f => ({ ...f, src: u.n }))).concat(x.summonFx || []);
    fxs.forEach(f => {
      if (f.stat) { stats[f.stat] = Number(stats[f.stat]) + f.add; mod[f.stat] = f.src; }
      if (f.w) {
        const names = [].concat(f.w);
        weapons.forEach(w => {
          if (!names.includes(w.name)) return;
          if (f.kw) addKw(w, f.kw);
          if (f.set) { Object.assign(w, f.set); w.setBy = Object.keys(f.set); }
          w.modBy = (w.modBy || []).concat(f.src);
        });
      }
    });
    const abilities = (d.abilities || []).map(([n, t, txt, nt]) => ({ n, t, d: txt, note: nt, ...timing(t) }));
    x.ups.forEach(u => { if (u.d) abilities.push({ n: u.n, t: u.t || '', d: u.d, upg: true, ...timing(u.t) }); });
    return { stats, mod, weapons, abilities };
  }

  // ── per-model loadout: "Marine 1: AGG-12 · Marine 2: C-14 Rifle + Rocket Launcher · Marines 3–6: C-14 Rifle" ──
  function loadout(x) {
    const d = x.def, eff = effective(x);
    const base = eff.weapons.filter(w => !w.spec);
    const spec = eff.weapons.filter(w => w.spec);
    const groups = [];
    for (let i = 0; i < x.models; i++) {
      let ws = base;
      const s = spec[i];
      if (s) ws = s.replaces && base.some(w => w.name === s.replaces) ? base.map(w => w.name === s.replaces ? s : w) : [...base, s];
      const key = ws.map(w => w.name).join('|');
      const g = groups[groups.length - 1];
      if (g && g.key === key && !s) g.to = i + 1;
      else groups.push({ key, from: i + 1, to: i + 1, ws, spec: s ? s.src : null });
    }
    const one = d.model || d.name, many = d.modelPl || d.plural || one + 's';
    return groups.map(g => ({
      label: x.models === 1 ? d.name : g.from === g.to ? `${one} ${g.from}` : `${many} ${g.from}–${g.to}`,
      ranged: g.ws.filter(w => !w.cc).map(w => w.name),
      melee: g.ws.filter(w => w.cc).map(w => w.name),
      spec: g.spec,
    }));
  }
  const loadoutText = (lines, melee = true) => lines.map(l =>
    `${l.label}: ${[l.ranged.join(' + '), melee ? l.melee.join(' + ') : ''].filter(Boolean).join(' · ') || '—'}`);

  // ── supply plan ──
  function missionValues(list, name) {
    const m = GAME.missions.find(x => x.name === (name || list.mission)) || GAME.missions[0];
    const [start, esc, rounds, lead] = list.scale === 'skirmish' ? m.sk : m.std;
    return { mission: m, start, esc, rounds, lead };
  }
  function supplyPlan(list, name) {
    const mv = missionValues(list, name);
    const pools = Array.from({ length: mv.rounds }, (_, i) => i === mv.rounds - 1 ? Infinity : mv.start + mv.esc * i);
    const units = (list.units || []).map(e => entry(e)).filter(x => x.def && !x.def.summoned).map(x => ({
      uid: x.e.uid, label: x.label, def: x.def, supply: x.poolSupply, slotSupply: x.supply,
      round: Number((list.deploy || {})[x.e.uid]) || 0,
    }));
    units.forEach(u => { u.earliest = pools.findIndex(p => p >= u.supply) + 1; });
    const rows = pools.map((pool, i) => {
      const r = i + 1;
      const onTable = units.filter(u => u.round >= 1 && u.round <= r).reduce((a, u) => a + u.supply, 0);
      return { r, pool, arriving: units.filter(u => u.round === r), onTable, over: Math.max(0, onTable - pool), final: r === mv.rounds };
    });
    return { ...mv, pools, rows, units,
      reserve: units.filter(u => !u.round || u.round > mv.rounds),
      total: units.reduce((a, u) => a + u.supply, 0) };
  }
  // Greedy: biggest Supply first, each into the earliest Round where it fits for the rest of the game.
  function autoPlan(list, name) {
    const p = supplyPlan(list, name);
    const load = p.pools.map(() => 0), deploy = {};
    [...p.units].sort((a, b) => b.supply - a.supply).forEach(u => {
      for (let r = 1; r <= p.rounds; r++) {
        if (p.pools.every((pool, i) => i < r - 1 || load[i] + u.supply <= pool)) {
          for (let i = r - 1; i < p.rounds; i++) load[i] += u.supply;
          deploy[u.uid] = r; return;
        }
      }
    });
    return deploy;
  }

  // ── lists ──
  function newList(o = {}) {
    const race = GAME.races[o.race] ? o.race : 'terran';
    return normalize({ name: o.name || 'New list', race, faction: o.faction || '', scale: o.scale || 'standard',
      cards: GAME.races[race].needsCreep ? ['creep-accel'] : [] });
  }
  function normalize(l) {
    l = l || {};
    const units = Array.isArray(l.units) ? l.units : [];
    return {
      v: 1, id: l.id || uid(), name: String(l.name || 'Untitled list').slice(0, 80),
      race: GAME.races[l.race] ? l.race : 'terran', faction: F[l.faction] ? l.faction : '',
      scale: GAME.scales[l.scale] ? l.scale : 'standard', limit: Number(l.limit) || GAME.scales.grand.limit,
      units: units.map(u => ({ uid: u.uid || uid(), id: String(u.id), n: Number(u.n) || (U[u.id] ? U[u.id].sizes[0][0] : 1),
        up: Array.isArray(u.up) ? u.up.map(String) : [] })),
      cards: Array.isArray(l.cards) ? l.cards.map(String) : [],
      mission: GAME.missions.some(m => m.name === l.mission) ? l.mission : GAME.missions[1].name,
      deploy: l.deploy && typeof l.deploy === 'object' ? { ...l.deploy } : {},
      used: l.used && typeof l.used === 'object' ? { ...l.used } : {},   // card key → true once Activated this Round
      round: Math.max(1, Number(l.round) || 1),
      updated: l.updated || Date.now(),
    };
  }
  function addUnit(list, id, n) {
    const def = U[id];
    const e = { uid: uid(), id, n: n || def.sizes[0][0], up: [] };
    list.units.push(e);
    return e;
  }
  // Toggle an upgrade; a whole-unit upgrade that replaces a weapon switches off any other one replacing the same weapon.
  function toggleUpgrade(e, name) {
    const def = U[e.id]; const u = def && (def.upgrades || []).find(x => x.n === name);
    if (!u) return;
    if (e.up.includes(name)) { e.up = e.up.filter(n => n !== name); return; }
    if (u.rep && !u.sp) {
      const clash = def.upgrades.filter(o => o !== u && o.rep === u.rep && !o.sp).map(o => o.n);
      e.up = e.up.filter(n => !clash.includes(n));
    }
    e.up.push(name);
  }

  // ── text export / import ──
  const ORDER = ['hero', 'core', 'elite', 'support', 'air'];
  function toText(list) {
    const ev = evaluate(list), sc = ev.scale, L = [];
    L.push(list.name || 'Untitled list');
    L.push(`${ev.race ? ev.race.name : '?'} · ${ev.fac ? ev.fac.name : 'no faction'} · ${sc.name} (${fmt(sc.limit)})`);
    L.push(`Minerals ${fmt(ev.minerals)}/${fmt(sc.limit)} · Gas ${fmt(ev.gas)}/${fmt(sc.gasLimit)} · ${ev.race ? ev.race.res : 'res'} ${ev.res}`);
    L.push('Slots: ' + SLOTS.filter(t => ev.prov[t] || ev.used[t]).map(t => `${SLOT_NAME[t]} ${ev.used[t]}/${ev.prov[t]}`).join(' · '));
    ev.errors.forEach(p => L.push(`! ${p.msg}`));
    ORDER.forEach(t => {
      const xs = ev.entries.filter(x => x.def && x.def.slot === t);
      if (!xs.length) return;
      L.push('', SLOT_NAME[t].toUpperCase());
      xs.forEach(x => {
        L.push(`• ${x.label} [${x.supply} Supply] — ${fmt(x.cost)}`);
        if (x.ups.length) L.push(`    + ${x.ups.map(u => u.n).join(', ')}`);
        if (x.ups.some(u => u.sp)) L.push(`    ${loadoutText(loadout(x), false).join(' | ')}`);
      });
    });
    L.push('', 'CARDS');
    if (ev.fac) L.push(`• ${ev.fac.name} (Faction card)`);
    const cnt = [];
    ev.cards.forEach(c => { const o = cnt.find(z => z.c === c); o ? o.n++ : cnt.push({ c, n: 1 }); });
    cnt.forEach(({ c, n }) => L.push(`• ${c.name}${n > 1 ? ' ×' + n : ''}${c.kind === 'creep' ? ' (Creep)' : ''} — ${c.gas * n} Gas`));
    L.push('', `Supply Line · unofficial list builder · data: ${GAME.version}`);
    return L.join('\n');
  }

  // ── NewRecruit-style text: same layout as a newrecruit.eu text export ──
  // Units grouped Core → Elite → Support → Air → Hero, A–Z by unit within a group.
  const NR_ORDER = ['core', 'elite', 'support', 'air', 'hero'];
  function toNewRecruit(list) {
    const ev = evaluate(list), L = [];
    const xs = ev.entries.filter(x => x.def);
    L.push(`${list.name || 'Untitled list'} - ${ev.race ? ev.race.name : '?'} (${ev.minerals} Minerals, ${ev.gas} Gas)`);
    L.push(`${xs.reduce((a, x) => a + x.supply, 0)} Supply, 0 CP`, '', 'Deployment Maps', 'Mission Card', '');
    L.push('# Faction:', ev.fac ? ev.fac.name : '', '');
    // One line per copy: the Tabletop Simulator importer rejects "2x" on card lines.
    const counted = kind => ev.cards.filter(c => (c.kind === 'creep') === (kind === 'creep')).map(c => c.name).sort((a, b) => a.localeCompare(b));
    const tactical = counted('tactical'), creep = counted('creep');
    L.push('# Tactical:', ...tactical, '');
    if (creep.length) L.push('# Creep:', ...creep, '');
    L.push('# Units:');
    const groups = NR_ORDER.map(t => xs.filter(x => x.def.slot === t)
      .map((x, i) => ({ x, i })).sort((a, b) => a.x.def.name.localeCompare(b.x.def.name) || a.i - b.i).map(o => o.x))
      .filter(g => g.length);
    groups.forEach((g, gi) => {
      if (gi) L.push('');
      g.forEach(x => {
        // NewRecruit names variants after the card title: "6x Kerrigan Swarm Raptors (Zergling)"
        const nr = x.def.nr || {};
        const base = x.models > 1 ? `${x.models}x ${x.def.plural || x.def.name + 's'}` : (nr.name || x.def.name);
        const name = x.def.variantOf ? `${base} (${x.def.variantOf})` : base;
        const opts = [nr.option, ...x.ups.map(u => u.nr || u.n)].filter(Boolean);   // Nova: "Nova (240, 1S): Stealth Mode"
        L.push(`${name} (${x.cost}, ${x.supply}S)${opts.length ? ': ' + opts.join(', ') : ''}`);
      });
    });
    // The Tabletop Simulator army importer rejects exports without NewRecruit's own footer line.
    L.push('', '', 'Created with newrecruit.eu v37.7');
    return L.join('\n');
  }

  // Reads a NewRecruit text export (or toNewRecruit output). Matches names loosely (singular/plural),
  // and when the "Nx" count is missing, picks the squad size whose cost adds up to the listed cost.
  function fromNewRecruit(text) {
    const lines = String(text || '').split(/\r?\n/).map(l => l.trim());
    const key = s => s.toLowerCase().replace(/[’']/g, "'").replace(/\s+/g, ' ').trim();
    const same = (a, b) => { a = key(a); b = key(b); return a === b || a.replace(/s$/, '') === b.replace(/s$/, ''); };
    const head = lines.find(Boolean) || '';
    const hm = head.match(/^(.*?)\s+-\s+(.*?)\s*\(\s*([\d,.]+)\s*Minerals?/i);
    let race = hm ? Object.keys(GAME.races).find(r => key(hm[2]).includes(r)) : null;
    const list = normalize({ name: hm ? hm[1] : head });
    list.cards = [];
    const minerals = hm ? parseInt(hm[3].replace(/[^\d]/g, ''), 10) : 0;
    list.scale = minerals > 2000 ? 'grand' : minerals > 1000 ? 'standard' : 'skirmish';
    if (list.scale === 'grand') list.limit = Math.ceil(minerals / 500) * 500;
    let section = null, facLine = null;
    const cardLines = [], unitLines = [];
    lines.slice(1).forEach(line => {
      const sec = line.match(/^#\s*([^:]+):?$/);
      if (sec) { section = key(sec[1]); return; }
      if (!line || /^created with/i.test(line)) return;
      if (section === 'faction') facLine = facLine || line;
      else if (section === 'units') unitLines.push(line);
      else if (section) cardLines.push(line);
    });
    const fac = facLine && GAME.factions.find(f => (!race || f.race === race) && same(f.name, facLine));
    if (fac) { race = fac.race; list.faction = fac.id; }
    list.race = race || 'terran';
    cardLines.forEach(line => {
      const m = line.match(/^(?:(\d+)\s*x\s+)?(.+)$/i);
      const c = GAME.cards.find(z => z.race === list.race && same(z.name, m[2]));
      if (c) for (let i = 0; i < (Number(m[1]) || 1); i++) list.cards.push(c.id);
    });
    unitLines.forEach(line => {
      const m = line.match(/^(?:(\d+)\s*x\s+)?(.+?)\s*\(\s*([\d,]+)\s*(?:,\s*\d+\s*S)?\s*\)\s*(?::\s*(.*))?$/i);
      if (!m) return;
      const wanted = (m[4] || '').split(/\s*,\s*/).filter(Boolean);
      // try the name as written ("Nova (Stealth Mode)"), then without a variant's base ("… Raptors (Zergling)");
      // NewRecruit's "Nova: Stealth Mode" picks the profile by its option
      const named = nm => GAME.units.find(u => !u.summoned && u.race === list.race && (same(u.name, nm) || same(u.plural || u.name + 's', nm)
        || (u.nr && same(u.nr.name, nm) && wanted.some(w => same(w, u.nr.option)))));
      const def = named(m[2]) || named(m[2].replace(/\s*\([^)]*\)$/, ''));
      if (!def) return;
      const ups = wanted.map(n => (def.upgrades || []).find(u => same(u.n, n) || (u.nr && same(u.nr, n)))).filter(Boolean);
      const cost = parseInt(m[3].replace(/[^\d]/g, ''), 10);
      const byCost = def.sizes.findIndex((s, i) => s[1] + ups.reduce((a, u) => a + upCost(u, i), 0) === cost);
      const n = def.sizes.some(s => s[0] === Number(m[1])) ? Number(m[1]) : byCost >= 0 ? def.sizes[byCost][0] : def.sizes[0][0];
      const e = addUnit(list, def.id, n);
      e.up = ups.map(u => u.n);
    });
    return list;
  }

  function fromText(text) {
    if (/^#\s*Units:?\s*$/mi.test(String(text || ''))) return fromNewRecruit(text);
    const lines = String(text || '').split(/\r?\n/);
    const first = lines.find(l => l.trim());
    if (!first) throw new Error('Nothing to import.');
    const byLen = arr => [...arr].sort((a, b) => b.name.length - a.name.length);
    // Faction: the "(Faction card)" line, else the header lines — never upgrade names like "Fury of the Nerazim".
    const facLine = lines.find(l => /\(faction( card)?\)/i.test(l)) || lines.slice(0, 4).join(' ');
    const fac = byLen(GAME.factions).find(f => facLine.toLowerCase().includes(f.name.toLowerCase()));
    let race = fac ? fac.race : (Object.keys(GAME.races).find(r => new RegExp(`\\b${r}\\b`, 'i').test(text)) || null);
    const list = normalize({ name: first.trim().replace(/^[•\-*]\s*/, ''), race: race || 'terran', faction: fac ? fac.id : '' });
    const gm = text.match(/grand offensive\s*\(([\d,.\s]+)\)/i);
    list.scale = /grand offensive/i.test(text) ? 'grand' : /skirmish/i.test(text) ? 'skirmish' : 'standard';
    if (gm) list.limit = parseInt(gm[1].replace(/[^\d]/g, ''), 10) || list.limit;
    list.cards = [];
    const norm = s => s.toLowerCase().replace(/[’']/g, "'").replace(/\s+/g, ' ').trim();
    let last = null;
    for (const raw of lines.slice(1)) {
      const line = raw.trim();
      if (!line) continue;
      if (/^\+/.test(line) && last) {
        const def = U[last.id];
        line.replace(/^\+\s*/, '').split(/\s*,\s*/).forEach(n => {
          const u = (def.upgrades || []).find(x => norm(x.n) === norm(n));
          if (u && !last.up.includes(u.n)) last.up.push(u.n);
        });
        continue;
      }
      if (!/^[•\-*]/.test(line)) continue;
      let body = line.replace(/^[•\-*]\s*/, '').replace(/\s*\[[^\]]*\]/g, '')
        .replace(/\s*[—–-]+\s*[\d,]+\s*(gas|minerals|pts|points)?\s*$/i, '').trim();
      if (/\(faction( card)?\)/i.test(body)) { last = null; continue; }
      body = body.replace(/\s*\(creep\)\s*/i, '').trim();
      let n = null;
      const cm = body.match(/^(.*?)\s*[×x]\s*(\d+)$/i) || body.match(/^(\d+)\s*[×x]?\s+(.*)$/i);
      if (cm) { if (/^\d+$/.test(cm[1])) { n = +cm[1]; body = cm[2]; } else { body = cm[1]; n = +cm[2]; } }
      const key = norm(body);
      const card = GAME.cards.find(c => (!race || c.race === race) && norm(c.name) === key);
      if (card) { for (let i = 0; i < (n || 1); i++) list.cards.push(card.id); last = null; continue; }
      const def = GAME.units.find(u => !u.summoned && (!race || u.race === race) && (norm(u.name) === key || norm(u.plural || u.name + 's') === key));
      if (def) {
        if (!race) { race = def.race; list.race = race; }
        last = addUnit(list, def.id, n || def.sizes[0][0]);
      } else last = null;
    }
    if (GAME.races[list.race].needsCreep && !list.cards.some(id => C[id] && C[id].kind === 'creep')) { /* left for the validator to flag */ }
    return list;
  }

  // ── share links (#l=…) ──
  function encodeShare(list) {
    const o = { n: list.name, r: list.race, f: list.faction, s: list.scale, l: list.scale === 'grand' ? list.limit : undefined,
      u: list.units.map(u => u.up.length ? [u.id, u.n, u.up] : [u.id, u.n]), c: list.cards, m: list.mission };
    return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function decodeShare(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    const o = JSON.parse(decodeURIComponent(escape(atob(s))));
    return normalize({ name: o.n, race: o.r, faction: o.f, scale: o.s, limit: o.l, cards: o.c, mission: o.m,
      units: (o.u || []).map(([id, n, up]) => ({ id, n, up: up || [] })) });
  }

  // ── example lists: the Founders box contents, legal at current costs ──
  const EXAMPLES = [
    { name: `Founders box — Khalai`, race: 'protoss', faction: 'khalai', scale: 'skirmish',
      units: [['zealot', 3, ['My Life for Aiur']], ['praetor', 3], ['adept', 4], ['sentry', 2], ['artanis', 1]],
      cards: ['gateway', 'warpprism', 'observer'] },
    { name: `Founders box — Raynor's Raiders`, race: 'terran', faction: 'rr', scale: 'skirmish',
      units: [['marine', 6], ['raider', 6], ['marauder', 2, ['Kinetic Foam']], ['medic', 3, ['Stabilizer Medpacks']], ['raynor', 1]],
      cards: ['barracks', 'academy', 'orbital'] },
  ];
  const example = i => {
    const x = EXAMPLES[i];
    return normalize({ ...x, units: x.units.map(([id, n, up]) => ({ id, n, up: up || [] })) });
  };

  // Summoned units the list can bring into play (from the Faction card and from units), as entries with
  // their parent's upgrade effects applied ({unit:'autoturret', …} in an upgrade's fx). Parents with
  // different relevant upgrades give separate entries.
  function summonedUnits(list) {
    const found = new Map();
    const add = (id, by, ups) => {
      const def = U[id];
      if (!def) return;
      const fx = [], from = [];
      ups.forEach(u => (u.fx || []).forEach(f => { if (f.unit === id) { fx.push({ ...f, src: u.n }); if (!from.includes(u.n)) from.push(u.n); } }));
      const key = `sum:${id}${from.length ? ':' + from.join(',') : ''}`;
      if (!found.has(key)) found.set(key, { key, def, fx, from, by: [] });
      if (!found.get(key).by.includes(by)) found.get(key).by.push(by);
    };
    const fac = F[list.faction];
    if (fac && fac.race === list.race) (fac.summons || []).forEach(id => add(id, fac.name, []));
    (list.units || []).forEach(e => { const x = entry(e); if (x.def) (x.def.summons || []).forEach(id => add(id, x.def.name, x.ups)); });
    return [...found.values()].map(s => ({ ...entry({ uid: s.key, id: s.def.id, n: s.def.sizes[0][0], up: [] }),
      summonFx: s.fx, fromUps: s.from, summonedBy: s.by }));
  }

  // Every card in play, each copy with its own key: faction "fac", tactical/creep "<id>#<copy>".
  function cardsInPlay(list) {
    const out = [], seen = {};
    const fac = F[list.faction];
    if (fac && fac.race === list.race) out.push({ key: 'fac', card: fac, faction: true, passive: false });
    (list.cards || []).forEach(id => {
      const c = C[id]; if (!c) return;
      seen[id] = (seen[id] || 0) + 1;
      out.push({ key: `${id}#${seen[id]}`, card: c, copy: seen[id], passive: c.kind === 'creep' });
    });
    return out;
  }

  return { SLOTS, SLOT_NAME, PHASES, timing, supplyProfile, cardsInPlay, summonedUnits, units: U, factions: F, cards: C, fmt, weapon, upCost, entry, evaluate, effective, loadout, loadoutText,
    scaleInfo, missionValues, supplyPlan, autoPlan, newList, normalize, addUnit, toggleUpgrade, toText, fromText,
    toNewRecruit, fromNewRecruit, encodeShare, decodeShare, EXAMPLES, example, uid };
})();
</script>

<script id="ui">
/* ─────────────────────────────────────────────────────────────────────────
   UI — renders the engine's view of the current list. Event delegation via data-act.
   ───────────────────────────────────────────────────────────────────────── */
(() => {
  const E = Engine;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = E.fmt;
  const KEY = 'supplyline.v1';
  const SLOT_ORDER = ['hero', 'core', 'elite', 'support', 'air'];
  const ui = { tab: null, armyOpen: null, open: new Set(), openCards: new Set(), modal: null, q: '', filter: 'all', peek: null };

  // ── storage ──
  function load() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) { /* blocked or corrupt */ }
    if (!s || !Array.isArray(s.lists)) s = { lists: [], current: null, theme: 'dark' };
    s.lists = s.lists.map(E.normalize);
    if (!s.lists.length) s.lists.push(E.newList({ race: 'terran', scale: 'standard', name: 'New list' }));
    if (!s.lists.some(l => l.id === s.current)) s.current = s.lists[0].id;
    return s;
  }
  let store = load();
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* storage full or blocked */ } };
  const cur = () => store.lists.find(l => l.id === store.current);
  function commit(fn) { const l = cur(); if (fn) fn(l); l.updated = Date.now(); persist(); render(); }
  function addList(l, msg) { store.lists.unshift(l); store.current = l.id; ui.open.clear(); persist(); render(); if (msg) toast(msg); }

  // ── helpers ──
  let toastT;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }
  const slotVar = t => `--c:var(--${t})`;
  const slotChips = slots => E.SLOTS.filter(t => slots[t]).map(t => `<span class="sg" style="${slotVar(t)}">+${slots[t]} ${E.SLOT_NAME[t]}</span>`).join(' ');
  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(() => toast('Copied'), () => fallbackCopy(text));
    fallbackCopy(text);
  }
  function fallbackCopy(text) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied'); } catch (e) { toast('Copy failed — select the text manually'); }
    ta.remove();
  }
  function download(name, text, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  const fileSafe = s => (s || 'list').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') || 'list';
  function applyTheme() {
    document.documentElement.dataset.theme = store.theme === 'light' ? 'light' : 'dark';
  }

  // ── budget bar ──
  function renderBar(l, ev) {
    const sc = ev.scale;
    const meter = (k, ks, ico, v, max) => `<div class="meter${v > max ? ' bad' : ''}" title="${k}"><span class="k"><i class="ico ico-${ico}" aria-hidden="true"></i><span class="kl">${k}</span><span class="ks">${ks}</span></span><span class="v">${fmt(v)}<small> / ${fmt(max)}</small></span><span class="fill" style="width:${max ? Math.min(100, v / max * 100) : 0}%"></span></div>`;
    const n = ev.errors.length;
    const slots = E.SLOTS.map(t => {
      const u = ev.used[t], p = ev.prov[t];
      const cls = u > p ? 'over' : (!u && !p) ? 'zero' : u === p ? 'full' : '';
      return `<span class="sc ${cls}" style="${slotVar(t)}" title="${esc(ev.provBy[t].map(x => `${x.name} ${x.n}`).join(', ') || 'none')}">${E.SLOT_NAME[t]} <b>${u}/${p}</b></span>`;
    }).join('');
    return `<div class="in">
      ${meter('Minerals', 'Min', 'min', ev.minerals, sc.limit)}
      ${meter('Gas', 'Gas', 'gas', ev.gas, sc.gasLimit)}
      <button class="probs ${n ? 'bad' : 'ok'}" data-act="goto-problems" aria-label="${n ? `${n} problems` : 'Legal list'}"><span class="long">${n ? `${n} problem${n > 1 ? 's' : ''}` : '✓ Legal'}</span><span class="short">${n ? `⚠ ${n}` : '✓'}</span></button>
      <div class="slotline">${slots}<span class="resn">${ev.race ? ev.race.res : ''} <b>${ev.res}</b><span class="rl">/round</span></span></div>
    </div>`;
  }

  // ── build tab ──
  function renderBuild(l, ev) {
    const races = Object.entries(GAME.races).map(([k, r]) => `<button data-act="race" data-race="${k}" aria-pressed="${l.race === k}">${r.name}</button>`).join('');
    const facs = GAME.factions.filter(f => f.race === l.race);
    const facOpts = `<option value="">Choose a faction…</option>` + facs.map(f => `<option value="${f.id}"${f.id === l.faction ? ' selected' : ''}>${esc(f.name)}</option>`).join('');
    const scales = Object.entries(GAME.scales).map(([k, s]) => `<button data-act="scale" data-scale="${k}" aria-pressed="${l.scale === k}">${s.name}${k !== 'grand' ? ` <small>${fmt(s.limit)}</small>` : ''}</button>`).join('');
    const fac = ev.fac;
    const setup = `<section class="card setup">
      <div class="row"><label class="lbl">Race</label><div class="seg">${races}</div></div>
      <div class="row"><label class="lbl" for="facSel">Faction</label><select id="facSel" data-act="faction">${facOpts}</select>
        ${fac ? `<span class="facinfo">${slotChips(fac.slots)} · ${fac.res} ${ev.race.res}</span>` : ''}</div>
      <div class="row"><label class="lbl">Scale</label><div class="seg">${scales}</div>
        ${l.scale === 'grand' ? `<input type="number" min="2001" step="50" value="${ev.scale.limit}" data-act="limit" aria-label="Mineral limit">` : ''}
        <span class="facinfo">${ev.scale.table} · Gas ${fmt(ev.scale.gasLimit)}</span></div>
    </section>`;

    const general = ev.errors.filter(p => !p.ref || !l.units.some(u => u.uid === p.ref));
    const unitErrs = ev.errors.length - general.length;
    const probs = `<section class="card problems" id="problems">
      <h3>Problems <span class="r">${ev.errors.length ? `<span style="color:var(--bad)">${ev.errors.length}</span>` : ''}</span></h3>
      ${ev.errors.length ? `<ul>${general.map(p => `<li>${esc(p.msg)}</li>`).join('')}${unitErrs ? `<li>${unitErrs} unit problem${unitErrs > 1 ? 's' : ''} — marked in red below.</li>` : ''}</ul>`
        : `<div class="legal">✓ Legal list</div>`}
      ${ev.notes.length ? `<ul style="margin-top:6px">${ev.notes.map(p => `<li class="note">${esc(p.msg)}</li>`).join('')}</ul>` : ''}
    </section>`;

    const groups = SLOT_ORDER.map(t => {
      const xs = ev.entries.filter(x => (x.def ? x.def.slot : 'core') === t);
      if (!xs.length) return '';
      return `<div class="group"><h3 style="${slotVar(t)}"><span style="color:var(--c)">${E.SLOT_NAME[t]}</span><span class="r">${ev.used[t]} / ${ev.prov[t]} slots</span></h3>
        ${xs.map(x => unitRow(x, ev)).join('')}</div>`;
    }).join('');
    const units = `<section>${groups || `<div class="empty">No units yet.</div>`}
      <button class="add" data-act="picker">+ Add unit</button></section>`;

    return setup + probs + units + `<div style="height:14px"></div>` + renderCards(l, ev);
  }

  function upTitle(u) {
    const bits = [];
    if (u.sp) bits.push('SPECIALIST — one model');
    if (u.rep) bits.push(`replaces ${u.rep}`);
    if (u.t) bits.push(u.t);
    if (u.d) bits.push(u.d);
    if (u.w && !u.d) bits.push(E.weapon(u.w).kw.join(', '));
    return bits.join(' · ');
  }

  function unitRow(x, ev) {
    const uid = x.e.uid;
    const errs = ev.errors.filter(p => p.ref === uid);
    if (!x.def) return `<article class="unit err" style="${slotVar('core')}"><header><h4>${esc(x.label)}</h4>
      <button class="btn small danger" data-act="remove" data-uid="${uid}">Remove</button></header></article>`;
    const d = x.def, open = ui.open.has(uid);
    const sizes = d.sizes.length > 1 ? `<div class="chips">${d.sizes.map(s => {
      const on = s[0] === x.models;
      return `<button class="chip size${on ? ' on' : ''}" data-act="size" data-uid="${uid}" data-n="${s[0]}" aria-pressed="${on}">${s[0]} <small>· ${s[1]} · ${s[2]} Supply</small></button>`;
    }).join('')}</div>` : '';
    const ups = (d.upgrades || []).length ? `<div class="chips">${d.upgrades.map(u => {
      const on = x.e.up.includes(u.n);
      return `<button class="chip${on ? ' on' : ''}" data-act="up" data-uid="${uid}" data-up="${esc(u.n)}" aria-pressed="${on}" title="${esc(upTitle(u))}">${u.sp ? '<i class="dia" title="Specialist">◆</i>' : ''}${esc(u.n)} <small>+${E.upCost(u, x.si)}</small></button>`;
    }).join('')}</div>` : '';
    const specOn = x.ups.some(u => u.sp);
    const summons = (d.summons || []).map(id => E.units[id] && E.units[id].name).filter(Boolean);
    const load = specOn && !open ? `<div class="loadline">${E.loadoutText(E.loadout(x)).map(s => esc(s).replace(/^([^:]+):/, '<b>$1:</b>')).join('<br>')}</div>` : '';
    return `<article class="unit${errs.length ? ' err' : ''}${open ? ' open' : ''}" style="${slotVar(d.slot)}" data-uid="${uid}">
      <header data-act="toggle" data-uid="${uid}" role="button" aria-expanded="${open}" tabindex="0">
        <span class="badge">${x.supply} Supply</span>
        <h4>${esc(x.label)}${d.unique ? ' <span class="tag uq">Unique</span>' : ''}</h4>
        <span class="cost"><i class="ico ico-min" aria-hidden="true"></i>${fmt(x.cost)}</span><span class="tw">▼</span>
      </header>
      ${sizes}${ups}${load}
      ${summons.length ? `<div class="loadline">Summons <b>${esc(summons.join(', '))}</b> · free, no slot — card on the Army tab</div>` : ''}
      ${errs.map(p => `<div class="uerr">⚠ ${esc(p.msg)}</div>`).join('')}
      ${open ? `${dcard(x, { embedded: true })}<div class="uactions" style="margin-top:8px">
        <button class="btn small" data-act="dup" data-uid="${uid}">Duplicate</button>
        <button class="btn small danger" data-act="remove" data-uid="${uid}">Remove</button></div>` : ''}
    </article>`;
  }

  // Effective datasheet: stats with numeric upgrades applied, weapons, abilities, loadout.
  // ── card-style datasheet: stat tiles, Models / Supply boxes, abilities and weapons grouped by phase ──
  const PHASE_LABEL = { Any: 'Any phase', Movement: 'Movement phase', Assault: 'Assault phase', Combat: 'Combat phase', Scoring: 'Scoring phase' };
  // ── keyword popups: hover on PC, tap on phones ──
  const KW = GAME.keywords || {};
  const kwEntry = k => { const e = KW[k]; return e && e.see ? [e.see, KW[e.see]] : [k, e]; };
  const KW_RE = new RegExp(`\\b(${Object.keys(KW).filter(k => !KW[k].pill).sort((a, b) => b.length - a.length).join('|')})\\b`, 'g');
  const kwAttr = k => KW[k] ? ` data-kw="${k}" tabindex="0"` : '';
  // Escapes text and turns every glossary keyword in it into a hover / tap target.
  function kwify(text) {
    text = String(text == null ? '' : text);
    let out = '', last = 0;
    text.replace(KW_RE, (m, k, i) => {
      out += `${esc(text.slice(last, i))}<span class="kwt"${kwAttr(k)}>${esc(m)}</span>`;
      last = i + m.length;
      return m;
    });
    return out + esc(text.slice(last));
  }
  let tipFor = null, tapWasOpen = false;
  function showTip(el) {
    const [name, e] = kwEntry(el.dataset.kw), t = $('#kwtip');
    if (!e) return;
    t.innerHTML = `<b>${esc(name)}</b>${e.p ? `<small>Core Rules p. ${e.p}</small>` : ''}<div>${esc(e.d)}</div>`;
    t.hidden = false; tipFor = el;
    const r = el.getBoundingClientRect(), w = t.offsetWidth, h = t.offsetHeight;
    t.style.left = `${Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8)}px`;
    t.style.top = `${Math.max(8, r.bottom + h + 14 > window.innerHeight ? r.top - h - 6 : r.bottom + 6)}px`;
  }
  function hideTip() { const t = $('#kwtip'); if (t) t.hidden = true; tipFor = null; }

  function abilityHtml(a) {
    const pills = `<span class="pill k-${a.kind.toLowerCase()}"${kwAttr(a.kind.toUpperCase())}>${a.kind}</span>`
      + (a.cost ? `<span class="pill cst"${kwAttr(a.cost.split(' ').pop())}>${esc(a.cost)}</span>` : '')
      + a.extra.map(x => `<span class="pill x"${kwAttr(x.toUpperCase())}>${esc(x)}</span>`).join('')
      + (a.upg ? '<span class="pill upg">Upgrade</span>' : '');
    return `<p class="ab"><b>${esc(a.n)}:</b> ${pills} ${kwify(a.d)}${a.note ? `<span class="abn">⚑ ${esc(a.note)}</span>` : ''}</p>`;
  }
  function weaponsTable(ws) {
    if (!ws.length) return '';
    const row = w => {
      const set = k => (w.setBy || []).includes(k) ? ' class="mod"' : '';
      const kws = w.kw.map(k => (w.newKw || []).includes(k) ? `<span class="mod">${kwify(k)}</span>` : kwify(k)).join(', ');
      const src = w.spec ? `Specialist upgrade · 1 model${w.replaces ? `, instead of ${w.replaces}` : ', extra weapon'}`
        : w.replaced ? `Upgrade · replaces ${w.replaced}` : w.src ? 'Upgrade · extra weapon' : '';
      return `<tr><td${w.src ? ' class="mod"' : ''}>${esc(w.name)}${src ? `<span class="wsrc">${esc(src)}</span>` : ''}</td>
        <td data-l="Rng">${esc(w.rng)}</td><td data-l="Tgt">${esc(w.tgt)}</td><td data-l="RoA">${esc(w.roa)}</td><td data-l="Hit">${esc(w.hit)}</td><td data-l="Surge"${set('surge')}>${esc(w.surge)}</td><td data-l="S.Die"${set('sd')}>${esc(w.sd)}</td><td data-l="Dmg">${esc(w.dmg)}</td><td class="kw${kws ? '' : ' none'}">${kws || '–'}</td></tr>`;
    };
    return `<div class="tw-wrap"><table class="weapons"><tr><th>Name</th><th>Rng</th><th>Target</th><th>RoA</th><th>Hit</th><th>Surge</th><th>S.Die</th><th>Dmg</th><th>Keywords</th></tr>${ws.map(row).join('')}</table></div>`;
  }
  // Ranged weapons live in the Assault phase, close combat weapons in the Combat phase — as on the cards.
  function phaseGroups(abilities, weapons = []) {
    return E.PHASES.map(ph => ({
      ph,
      weapons: weapons.filter(w => (ph === 'Assault' && !w.cc) || (ph === 'Combat' && w.cc)),
      abilities: abilities.filter(a => a.phase === ph),
    })).filter(g => g.weapons.length || g.abilities.length);
  }
  const phaseSections = groups => groups.map(g => `<section class="dc-ph"><h4>${PHASE_LABEL[g.ph]}</h4>${weaponsTable(g.weapons)}${g.abilities.map(abilityHtml).join('')}</section>`).join('');
  function supplyBoxes(x) {
    const boxes = E.supplyProfile(x.def, x.models).map(p => `<div class="ms${p.cur && !x.def.summoned ? ' cur' : ''}"><span>${esc(p.models)}</span><b>${esc(p.supply)}</b></div>`).join('');
    return `<div class="msup" title="Models remaining → Current Supply"><div class="msrow">${boxes}</div><small>Models / Supply</small></div>`;
  }
  function dcard(x, opts = {}) {
    const d = x.def, eff = E.effective(x), s = eff.stats;
    // Tiles drop the inch marks (as the cards do); "2 (3 sieged)" shows the bracket as a small second line.
    const tile = (k, label, v) => {
      let main = String(v).replace(/″/g, ''), sub = '';
      const m = main.match(/^(.*?)\s*\((.+)\)$/);
      if (m) { main = m[1]; sub = m[2]; }
      return `<div class="st${eff.mod[k] ? ' mod' : ''}${main.length > 3 ? ' long' : ''}" title="${esc(label)}: ${esc(v)}${eff.mod[k] ? ` · ${esc(eff.mod[k])}` : ''}"><b>${esc(main)}${sub ? `<small>${esc(sub)}</small>` : ''}</b><span>${label}</span></div>`;
    };
    const tiles = (s.sh != null ? tile('sh', 'Shield', s.sh) : '') + tile('spd', 'Speed', s.spd) + tile('arm', 'Armour', s.arm)
      + tile('eva', 'Evade', s.eva) + tile('hp', 'Hit points', s.hp) + tile('size', 'Size', s.size);
    const from = x.fromUps && x.fromUps.length ? x.fromUps : [];
    const sub = d.summoned ? `Summoned by ${esc(d.by)}${from.length ? ` · ${esc(from.join(', '))}` : ''} · free, no slot`
      : `${E.SLOT_NAME[d.slot]} · ${x.supply} Supply · ${esc(d.role)} · Ø${esc(d.base.replace(/mm$/, ' mm'))}${d.unique ? ' · <span class="tag uq">Unique</span>' : ''}`;
    const tog = opts.key != null;   // collapsible (Army tab)
    const head = opts.embedded ? '' : `<header class="dc-head${tog ? ' tog' : ''}"${tog ? ` data-act="army-toggle" data-key="${esc(opts.key)}" role="button" tabindex="0" aria-expanded="${!!opts.open}"` : ''}>
      <div class="dc-name"><h3>${esc(x.label)}</h3><div class="dc-sub">${sub}</div></div>
      ${d.summoned ? '<span class="tag">Summoned</span>' : `<span class="cost"><i class="ico ico-min" aria-hidden="true"></i>${fmt(x.cost)}</span>`}${tog ? '<span class="tw">▼</span>' : ''}</header>`;
    if (tog && !opts.open) return `<article class="dcard card closed" data-key="${esc(opts.key)}" style="${slotVar(d.slot || 'core')}">${head}</article>`;
    const ups = x.ups.length ? `<div><b>Upgrades:</b> ${esc(x.ups.map(u => u.n).join(', '))}</div>`
      : from.length ? `<div class="mod"><b>Upgraded by ${esc(x.summonedBy.join(' / '))}:</b> ${esc(from.join(', '))}</div>` : '';
    const load = d.summoned ? '' : E.loadoutText(E.loadout(x)).map(l => `<div>${esc(l).replace(/^([^:]+):/, '<b>$1:</b>')}</div>`).join('');
    const pool = x.poolSupply !== x.supply ? `<div class="mod">Counts 0 Supply for the Supply Pool (Advanced Medic Facilities).</div>` : '';
    return `<article class="dcard${opts.embedded ? ' embedded' : ' card'}${tog ? ' open' : ''}"${tog ? ` data-key="${esc(opts.key)}"` : ''} style="${slotVar(d.slot || 'core')}">${head}
      ${opts.embedded ? `<div class="dc-sub" style="margin-bottom:8px">${sub}</div>` : ''}
      <div class="dc-top"><div class="dc-stats">${tiles}</div>${supplyBoxes(x)}</div>
      ${ups || load || pool ? `<div class="dc-load">${ups}${load}${pool}</div>` : ''}
      ${phaseSections(phaseGroups(eff.abilities, eff.weapons))}
      <footer class="dc-foot">${esc(d.tags.join(', '))} · Combat tags: ${esc(d.ctags)}</footer>
    </article>`;
  }
  const cardAbilities = c => c.abilities.map(([n, t, d]) => ({ n, t, d, ...E.timing(t) }));

  function renderCards(l, ev) {
    const fac = ev.fac;
    const isZerg = !!(ev.race && ev.race.needsCreep);
    const creeps = GAME.cards.filter(c => c.kind === 'creep' && c.race === l.race);
    const creepRow = isZerg ? `<div class="crow"><span class="nm">Creep card <small class="muted">(exactly one)</small></span>
      <div class="seg">${creeps.map(c => `<button data-act="creep" data-id="${c.id}" aria-pressed="${l.cards.includes(c.id)}">${esc(c.name.replace(' Creep', ''))} <small>${c.gas}</small></button>`).join('')}</div></div>` : '';
    const counts = [];
    l.cards.forEach(id => { const c = E.cards[id]; if (!c || c.kind === 'creep') return; const o = counts.find(z => z.c === c); o ? o.n++ : counts.push({ c, n: 1 }); });
    const unknownCards = l.cards.filter(id => !E.cards[id]);
    const rows = counts.map(({ c, n }) => {
      const open = ui.openCards.has(c.id);
      return `<div class="crow">
        <span class="nm" data-act="card-toggle" data-id="${c.id}">${esc(c.name)} ${c.unique ? '<span class="tag uq">Unique</span>' : ''}<br><small class="muted">${slotChips(c.slots)} · ${c.res ? `${c.res} ${ev.race.res}` : `<span style="color:var(--warn)">no ${ev.race ? ev.race.res : 'res'}</span>`}</small></span>
        <span class="gas">${c.gas * n}</span>
        ${c.unique ? `<button class="btn small danger" data-act="card-remove" data-id="${c.id}" aria-label="Remove ${esc(c.name)}">✕</button>`
          : `<span class="step"><button data-act="card-dec" data-id="${c.id}" aria-label="One fewer">−</button><span>${n}</span><button data-act="card-inc" data-id="${c.id}" aria-label="One more">+</button></span>`}
        ${open ? `<div class="cabl">${c.abilities.map(a => `<div><b>${esc(a[0])}</b> <small>${esc(a[1])}</small> — ${kwify(a[2])}</div>`).join('')}${c.note ? `<div>${esc(c.note)}</div>` : ''}</div>` : ''}
      </div>`;
    }).join('');
    return `<section class="card" id="cards">
      <h3>Cards <span class="r">Gas ${fmt(ev.gas)} / ${fmt(ev.scale.gasLimit)} · ${ev.res} ${ev.race ? ev.race.res : ''}</span></h3>
      ${fac ? `<div class="crow"><span class="nm" data-act="card-toggle" data-id="fac:${fac.id}">${esc(fac.name)} <small class="muted">Faction card</small><br><small class="muted">${slotChips(fac.slots)} · ${fac.res} ${ev.race.res}</small></span><span class="gas">0</span>
        ${ui.openCards.has('fac:' + fac.id) ? `<div class="cabl">${fac.abilities.map(a => `<div><b>${esc(a[0])}</b> <small>${esc(a[1])}</small> — ${kwify(a[2])}</div>`).join('')}</div>` : ''}</div>` : ''}
      ${creepRow}${rows}
      ${unknownCards.map(id => `<div class="crow"><span class="nm" style="color:var(--bad)">Unknown card “${esc(id)}”</span><button class="btn small danger" data-act="card-remove" data-id="${esc(id)}">✕</button></div>`).join('')}
      <button class="add" style="margin-top:8px" data-act="cardpicker">+ Add tactical card</button>
    </section>`;
  }

  // ── army tab: every unit as a card, A–Z, one open at a time ──
  function renderArmy(l, ev) {
    if (!ev.entries.some(x => x.def)) return `<div class="card empty">No units yet.<br><br><button class="btn primary" data-act="tab" data-tab="build">Build your list</button></div>`;
    // summoned units (Auto-Turret, Pylon…) sit in the same A–Z list, after a bought unit of the same name
    const items = ev.entries.filter(x => x.def).concat(E.summonedUnits(l))
      .sort((a, b) => a.label.localeCompare(b.label, 'en', { numeric: true }) || (a.def.summoned ? 1 : 0) - (b.def.summoned ? 1 : 0));
    return items.map(x => dcard(x, { key: x.e.uid, open: ui.armyOpen === x.e.uid })).join('');
  }
  const summonedEntry = d => E.entry({ uid: 'peek', id: d.id, n: d.sizes[0][0], up: [] });

  // ── cards tab: mark cards as used during a Round, ready them all for the next one ──
  function renderPlay(l, ev) {
    const inPlay = E.cardsInPlay(l);
    const res = ev.race ? ev.race.res : '';
    const usable = inPlay.filter(c => !c.passive);
    const ready = usable.filter(c => !l.used[c.key]);
    const resReady = ready.reduce((a, c) => a + (c.card.res || 0), 0);
    const top = `<section class="card roundbar">
      <div class="roundno"><small>Round</small>${l.round}</div>
      <div class="roundinfo"><b>${ready.length}</b> of ${usable.length} cards ready · <b>${resReady} ${res}</b> available
        <div class="small muted">Exhaust a card for its ${ev.race ? ev.race.resName : 'resource'}, or use one of its abilities (that exhausts it too). Tap Activate when you do.</div></div>
      <div class="roundbtns"><button class="btn primary" data-act="new-round">New round</button><button class="btn small ghost" data-act="reset-round">Reset to Round 1</button></div>
    </section>`;
    if (!inPlay.length) return top + `<div class="card empty">No cards yet — pick a Faction card and add Tactical cards on the Build tab.</div>`;
    const item = ({ key, card, faction, passive, copy }) => {
      const used = !!l.used[key];
      const n = l.cards.filter(id => id === card.id).length;
      const sub = faction ? `Faction card · +${card.res} ${res}` : passive ? 'Creep card · always in effect'
        : `Tactical card${n > 1 ? ` · copy ${copy} of ${n}` : ''} · ${card.res ? `+${card.res} ${res}` : `<span style="color:var(--warn)">no ${res}</span>`}`;
      return `<article class="card pcard${used ? ' used' : ''}" style="${slotVar(faction ? 'hero' : 'core')}">
        <header class="dc-head"><div class="dc-name"><h3>${esc(card.name)}</h3><div class="dc-sub">${sub}${card.unique ? ' · <span class="tag uq">Unique</span>' : ''}</div></div>
          ${passive ? '' : `<button class="btn${used ? ' ghost' : ''}" data-act="use" data-key="${esc(key)}" aria-pressed="${used}">${used ? 'Undo' : 'Activate'}</button>`}</header>
        <div class="pc-body">${phaseSections(phaseGroups(cardAbilities(card)))}${card.note ? `<p class="small muted">${esc(card.note)}</p>` : ''}</div>
        ${used ? '<span class="stamp" aria-hidden="true">Used</span>' : ''}
      </article>`;
    };
    return top + inPlay.map(item).join('');
  }

  // ── supply plan tab ──
  function renderPlan(l, ev) {
    const p = E.supplyPlan(l);
    const opts = GAME.missions.map(m => `<option${m.name === p.mission.name ? ' selected' : ''}>${esc(m.name)}</option>`).join('');
    const scaleNote = l.scale === 'skirmish' ? 'Skirmish' : l.scale === 'grand' ? 'Standard values (no Grand Offensive values published)' : 'Standard';
    const rows = p.rows.map(r => `<tr class="${r.over ? 'over' : ''}"><td>R${r.r}${r.final ? ' <small class="muted">final</small>' : ''}</td>
      <td class="num">${r.final ? '∞' : r.pool}</td>
      <td>${r.arriving.map(u => esc(u.label)).join(', ') || '<span class="faint">—</span>'}</td>
      <td class="num">${r.onTable}${r.final ? '' : ` / ${r.pool}`}</td>
      <td class="num">${r.final ? '∞' : r.over ? `+${r.over} over` : r.pool - r.onTable}</td></tr>`).join('');
    const prow = u => {
      const btns = Array.from({ length: p.rounds }, (_, i) => {
        const r = i + 1, fits = u.supply <= p.pools[i];
        return `<button data-act="deploy" data-uid="${u.uid}" data-r="${r}" aria-pressed="${u.round === r}" class="${fits ? '' : 'no'}" title="${fits ? '' : 'Too big for this Round on its own'}">R${r}</button>`;
      }).join('');
      return `<div class="prow"><span class="nm"><b>${esc(u.label)}</b> <small class="muted">${u.supply} Supply${u.supply !== u.slotSupply ? ' (Advanced Medic Facilities)' : ''} · fits from R${u.earliest}</small></span>
        <span class="rsel">${btns}<button data-act="deploy" data-uid="${u.uid}" data-r="0" aria-pressed="${!u.round}">—</button></span></div>`;
    };
    return `<section class="card">
      <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><label class="lbl" for="missionSel" style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em">Mission</label>
        <select id="missionSel" data-act="mission">${opts}</select></div>
      <p class="small muted" style="margin:8px 0 0">${scaleNote}: Supply Pool starts at <b>${p.start}</b>, +${p.esc} each Round, ${p.rounds} Rounds — unlimited in the final Round.${p.lead ? ` Ends early if a player leads by ${p.lead}+ VP.` : ''}<br>${esc(p.mission.brief)}</p>
    </section>
    <section class="card"><h3>Rounds <span class="r">army total ${p.total} Supply</span></h3>
      <div class="tw-wrap"><table class="plan"><tr><th>Round</th><th style="text-align:right">Pool</th><th>Arriving</th><th style="text-align:right">On table</th><th style="text-align:right">Free</th></tr>${rows}</table></div>
      <p class="small muted" style="margin:8px 0 0">“On table” assumes nothing has died yet — losses free up Supply. Units still in Reserves when the game ends count as destroyed.</p>
    </section>
