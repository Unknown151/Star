    <section class="card"><h3>Deploy order <span class="r"><button class="btn small" data-act="autoplan">Auto-fill</button> <button class="btn small ghost" data-act="clearplan">Clear</button></span></h3>
      ${p.units.length ? p.units.map(prow).join('') : '<div class="empty">No units yet.</div>'}
      ${p.reserve.length && p.units.length ? `<p class="small muted" style="margin:8px 0 0">Not planned: ${esc(p.reserve.map(u => u.label).join(', '))}.</p>` : ''}
    </section>`;
  }

  // ── roster tab ──
  const ROSTER_FMT = { nr: { name: 'NewRecruit', fn: l => E.toNewRecruit(l) }, sl: { name: 'Supply Line', fn: l => E.toText(l) } };
  const rosterFmt = () => ROSTER_FMT[store.rosterFmt] ? store.rosterFmt : 'nr';
  const rosterText = l => ROSTER_FMT[rosterFmt()].fn(l);
  function renderRoster(l) {
    const seg = Object.entries(ROSTER_FMT).map(([k, f]) => `<button data-act="roster-fmt" data-f="${k}" aria-pressed="${rosterFmt() === k}">${f.name}</button>`).join('');
    return `<div class="setup" style="margin-bottom:10px"><div class="row"><span class="lbl">Text format</span><div class="seg">${seg}</div></div></div>
    <div class="btnrow">
      <button class="btn primary" data-act="copytext">Copy text</button>
      <button class="btn" data-act="print">Print</button>
      <button class="btn" data-act="sharelink">Copy share link</button>
      <button class="btn" data-act="dl-txt">Download .txt</button>
      <button class="btn" data-act="dl-json">Download .json</button>
    </div><pre class="roster">${esc(rosterText(l))}</pre>`;
  }

  function printView(l, ev) {
    const sc = ev.scale;
    const rows = SLOT_ORDER.flatMap(t => ev.entries.filter(x => x.def && x.def.slot === t)).map(x => `<tr><td><b>${esc(x.label)}</b></td><td>${E.SLOT_NAME[x.def.slot]} · ${x.supply}</td>
      <td>${esc(x.ups.map(u => u.n).join(', ')) || '—'}${x.ups.some(u => u.sp) ? `<br><span class="muted">${esc(E.loadoutText(E.loadout(x), false).join(' · '))}</span>` : ''}</td><td style="text-align:right">${fmt(x.cost)}</td></tr>`).join('');
    const cards = [...new Set(ev.cards)].map(c => { const n = ev.cards.filter(z => z === c).length; return `<tr><td>${esc(c.name)}${n > 1 ? ' ×' + n : ''}</td><td>${E.SLOTS.filter(t => c.slots[t]).map(t => `${c.slots[t] * n} ${E.SLOT_NAME[t]}`).join(', ') || '—'}</td><td>${c.res * n} ${ev.race.res}</td><td style="text-align:right">${c.gas * n}</td></tr>`; }).join('');
    const sheets = ev.entries.filter(x => x.def).concat(E.summonedUnits(l)).map(x => {
      const eff = E.effective(x), s = eff.stats;
      const prof = E.supplyProfile(x.def, x.models).map(p => `${p.models}: ${p.supply}`).join(' · ');
      const groups = phaseGroups(eff.abilities, eff.weapons).map(g => `<div class="pph"><b>${PHASE_LABEL[g.ph]}</b>
        ${g.weapons.length ? `<table><tr><th>Weapon</th><th>Rng</th><th>Tgt</th><th>RoA</th><th>Hit</th><th>Surge</th><th>S.Die</th><th>Dmg</th><th>Keywords</th></tr>
          ${g.weapons.map(w => `<tr><td>${esc(w.name)}${w.spec ? ' (1 model)' : ''}</td><td>${esc(w.rng)}</td><td>${esc(w.tgt)}</td><td>${esc(w.roa)}</td><td>${esc(w.hit)}</td><td>${esc(w.surge)}</td><td>${esc(w.sd)}</td><td>${esc(w.dmg)}</td><td>${esc(w.kw.join(', ') || '–')}</td></tr>`).join('')}</table>` : ''}
        ${g.abilities.length ? `<ul>${g.abilities.map(a => `<li><b>${esc(a.n)}</b> (${esc([a.kind, a.cost, ...a.extra].filter(Boolean).join(' · '))}${a.upg ? ' · upgrade' : ''}): ${esc(a.d)}</li>`).join('')}</ul>` : ''}</div>`).join('');
      const tail = x.def.summoned ? `summoned by ${x.summonedBy.join(' / ')}${x.fromUps.length ? ` · ${x.fromUps.join(', ')}` : ''} · free` : fmt(x.cost);
      return `<div class="ds"><h3>${esc(x.label)} <span class="muted">— ${esc(tail)}</span></h3>
        <div class="muted">${s.sh != null ? `Shield ${s.sh} · ` : ''}Speed ${esc(s.spd)} · Armour ${esc(s.arm)} · Evade ${esc(s.eva)} · HP ${esc(s.hp)} · Size ${esc(s.size)} · Models/Supply ${esc(prof)}</div>
        <div class="muted">${esc(E.loadoutText(E.loadout(x)).join(' · '))}</div>${groups}</div>`;
    }).join('');
    return `<h1>${esc(l.name)}</h1>
      <div>${esc(ev.race ? ev.race.name : '')} · ${esc(ev.fac ? ev.fac.name : 'no faction')} · ${sc.name} (${fmt(sc.limit)}) · Minerals ${fmt(ev.minerals)}/${fmt(sc.limit)} · Gas ${fmt(ev.gas)}/${fmt(sc.gasLimit)} · ${ev.res} ${ev.race ? ev.race.res : ''}/round</div>
      <div>Slots: ${E.SLOTS.filter(t => ev.prov[t] || ev.used[t]).map(t => `${E.SLOT_NAME[t]} ${ev.used[t]}/${ev.prov[t]}`).join(' · ')}${ev.errors.length ? ` · <b>${ev.errors.length} problem(s)</b>` : ' · legal'}</div>
      <h2>Units</h2><table><tr><th>Unit</th><th>Slot · Supply</th><th>Upgrades / loadout</th><th>Minerals</th></tr>${rows}</table>
      <h2>Cards</h2><table><tr><th>Card</th><th>Slots</th><th>Resource</th><th>Gas</th></tr>${ev.fac ? `<tr><td>${esc(ev.fac.name)} (Faction)</td><td>${E.SLOTS.filter(t => ev.fac.slots[t]).map(t => `${ev.fac.slots[t]} ${E.SLOT_NAME[t]}`).join(', ')}</td><td>${ev.fac.res} ${ev.race.res}</td><td style="text-align:right">0</td></tr>` : ''}${cards}</table>
      <h2>Datasheets</h2>${sheets}
      <div class="foot">Supply Line — unofficial fan tool, not affiliated with Blizzard Entertainment or Archon Studio. StarCraft is a trademark of Blizzard Entertainment. Data: ${esc(GAME.version)}. Ability text paraphrased; the printed cards win.</div>`;
  }

  // ── modals ──
  function renderModal(l, ev) {
    const m = $('#modal');
    if (!ui.modal) { m.innerHTML = ''; return; }
    let head = '', body = '';
    if (ui.modal === 'picker') ({ head, body } = unitPicker(l, ev));
    if (ui.modal === 'cardpicker') ({ head, body } = cardPicker(l, ev));
    if (ui.modal === 'lists') ({ head, body } = listsModal(l));
    if (ui.modal === 'import') ({ head, body } = importModal());
    const keepScroll = m.querySelector('.pb') ? m.querySelector('.pb').scrollTop : 0;
    const hadFocus = document.activeElement && document.activeElement.id === 'pickQ';
    m.innerHTML = `<div class="modal" data-act="close-bg"><div class="panel" role="dialog" aria-modal="true"><div class="ph">${head}</div><div class="pb">${body}</div></div></div>`;
    const pb = m.querySelector('.pb'); if (pb) pb.scrollTop = keepScroll;
    if (hadFocus) { const q = $('#pickQ'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }

  function unitPicker(l, ev) {
    const fac = ev.fac;
    const filters = ['all', ...SLOT_ORDER.filter(t => t !== 'air')];
    const q = ui.q.trim().toLowerCase();
    const inList = id => l.units.some(u => u.id === id);
    const all = GAME.units.filter(u => u.race === l.race && !u.summoned);
    const shown = all.filter(u => (ui.filter === 'all' || u.slot === ui.filter) && (!q || u.name.toLowerCase().includes(q) || (u.plural || '').toLowerCase().includes(q)));
    const item = u => {
      const missing = fac ? u.tags.filter(t => !fac.tags.includes(t)) : [];
      const why = missing.length ? `Needs ${GAME.factions.filter(f => f.race === l.race && u.tags.every(t => f.tags.includes(t))).map(f => f.name).join(' / ')}`
        : u.unique && inList(u.id) ? 'Already in your list (Unique)'
        : u.excl && l.units.some(e => E.units[e.id] && E.units[e.id].excl === u.excl && e.id !== u.id) ? 'The other Nova is already in your list' : '';
      const peek = ui.peek === u.id;
      return `<div class="pick${why ? ' dim' : ''}">
        <div class="top"><span class="nm" data-act="peek" data-id="${u.id}">${esc(u.name)} <span class="badge" style="${slotVar(u.slot)}">${E.SLOT_NAME[u.slot]}</span>
          ${u.unique ? '<span class="tag uq">Unique</span>' : ''} ${u.tags.length > 1 ? `<span class="tag">${esc(u.tags.slice(1).join(', '))}</span>` : ''} <small class="muted">${peek ? '▲' : 'ⓘ'}</small></span></div>
        ${why ? `<div class="why">${esc(why)}</div>` : ''}
        <div class="opts">${u.sizes.map(s => `<button class="chip size" data-act="add" data-id="${u.id}" data-n="${s[0]}">${u.sizes.some(z => z[0] > 1) ? `${s[0]} model${s[0] > 1 ? 's' : ''} · ` : ''}<b>${s[1]}</b> <small>· ${s[2]} Supply</small></button>`).join('')}</div>
        ${peek ? dcard(summonedEntry(u), { embedded: true }) : ''}
      </div>`;
    };
    const summoned = GAME.units.filter(u => u.race === l.race && u.summoned && (!q || u.name.toLowerCase().includes(q)));
    const head = `<div class="top"><h2>Add unit</h2><span class="small muted">${fmt(ev.minerals)} / ${fmt(ev.scale.limit)}</span><button class="btn primary" data-act="close">Done</button></div>
      <input type="search" id="pickQ" data-act="pick-q" placeholder="Search ${esc(GAME.races[l.race].name)} units…" value="${esc(ui.q)}" autocomplete="off">
      <div class="chips" style="margin:0">${filters.map(f => `<button class="chip${ui.filter === f ? ' on' : ''}" data-act="pick-filter" data-f="${f}">${f === 'all' ? 'All' : E.SLOT_NAME[f]}</button>`).join('')}</div>`;
    const body = (shown.length ? shown.map(item).join('') : `<div class="empty">No match.</div>`)
      + (summoned.length && (ui.filter === 'all') ? `<h4 class="pick" style="border:none">Summoned during play — free, no slot (info only)</h4>${summoned.map(u => `<div class="pick"><div class="top"><span class="nm" data-act="peek" data-id="${u.id}">${esc(u.name)} <small class="muted">via ${esc(u.by)} ${ui.peek === u.id ? '▲' : 'ⓘ'}</small></span></div>${ui.peek === u.id ? dcard(summonedEntry(u), { embedded: true }) : ''}</div>`).join('')}` : '');
    return { head, body };
  }

  function cardPicker(l, ev) {
    const fac = ev.fac;
    const cards = GAME.cards.filter(c => c.race === l.race && c.kind !== 'creep');
    const gasLeft = ev.scale.gasLimit - ev.gas;
    const item = c => {
      const why = c.unique && l.cards.includes(c.id) ? 'Already in your list (Unique)'
        : fac && c.tags && !c.tags.every(t => fac.tags.includes(t)) ? `Needs ${GAME.factions.filter(f => c.tags.every(t => f.tags.includes(t))).map(f => f.name).join(' / ')}` : '';
      const peek = ui.peek === c.id;
      return `<div class="pick${why ? ' dim' : ''}"><div class="top">
        <span class="nm" data-act="peek" data-id="${c.id}">${esc(c.name)} ${c.unique ? '<span class="tag uq">Unique</span>' : ''} <small class="muted">${peek ? '▲' : 'ⓘ'}</small><br>
          <small>${slotChips(c.slots)} · ${c.res ? `${c.res} ${ev.race.res}` : `<span style="color:var(--warn)">no ${ev.race.res}</span>`}</small></span>
        <button class="chip size" data-act="add-card" data-id="${c.id}" ${why && c.unique && l.cards.includes(c.id) ? 'disabled' : ''}><b>${c.gas}</b> <small>Gas${c.gas > gasLeft ? ' · over' : ''}</small></button></div>
        ${why ? `<div class="why">${esc(why)}</div>` : ''}
        ${peek ? `<div class="cabl" style="margin-top:6px">${c.abilities.map(a => `<div><b>${esc(a[0])}</b> <small>${esc(a[1])}</small> — ${kwify(a[2])}</div>`).join('')}${c.note ? `<div>${esc(c.note)}</div>` : ''}</div>` : ''}
      </div>`;
    };
    const head = `<div class="top"><h2>Add tactical card</h2><span class="small muted">Gas ${fmt(ev.gas)} / ${fmt(ev.scale.gasLimit)}</span><button class="btn primary" data-act="close">Done</button></div>
      <div class="slotline" style="display:flex;gap:5px;flex-wrap:wrap">${E.SLOTS.map(t => `<span class="sc ${ev.used[t] > ev.prov[t] ? 'over' : ''}" style="${slotVar(t)}">${E.SLOT_NAME[t]} <b>${ev.used[t]}/${ev.prov[t]}</b></span>`).join('')}</div>`;
    return { head, body: cards.map(item).join('') };
  }

  function listsModal(l) {
    const rows = store.lists.slice().sort((a, b) => b.updated - a.updated).map(x => {
      const ev = E.evaluate(x);
      return `<div class="lrow${x.id === l.id ? ' cur' : ''}"><span class="nm"><b>${esc(x.name)}</b><br><small class="muted">${esc(ev.race.name)} · ${esc(ev.fac ? ev.fac.name : 'no faction')} · ${fmt(ev.minerals)}/${fmt(ev.scale.limit)} · ${ev.errors.length ? `<span style="color:var(--bad)">${ev.errors.length} problem${ev.errors.length > 1 ? 's' : ''}</span>` : '<span style="color:var(--ok)">legal</span>'}</small></span>
        ${x.id === l.id ? '<span class="small muted">open</span>' : `<button class="btn small" data-act="open-list" data-id="${x.id}">Open</button>`}
        <button class="btn small" data-act="copy-list" data-id="${x.id}">Copy</button>
        <button class="btn small danger" data-act="delete-list" data-id="${x.id}">Delete</button></div>`;
    }).join('');
    const head = `<div class="top"><h2>My lists</h2><button class="btn" data-act="close">Close</button></div>
      <div class="chips" style="margin:0">${Object.entries(GAME.races).map(([k, r]) => `<button class="btn small primary" data-act="new-list" data-race="${k}">+ New ${r.name}</button>`).join('')}
        <button class="btn small" data-act="import">Import…</button><button class="btn small" data-act="export-all">Back up all</button></div>`;
    const ex = E.EXAMPLES.map((x, i) => `<div class="lrow"><span class="nm">${esc(x.name)} <small class="muted">· ${esc(E.factions[x.faction].name)} · ${GAME.scales[x.scale].name}</small></span><button class="btn small" data-act="example" data-i="${i}">Load</button></div>`).join('');
    const isLight = store.theme === 'light';
    const theme = [['dark', 'Command console'], ['light', 'Daylight']].map(([t, name]) => `<button data-act="theme" data-t="${t}" aria-pressed="${(t === 'light') === isLight}">${name}</button>`).join('');
    return { head, body: rows
      + `<h4 class="pick" style="border:none;margin:16px 0 0">Founders box lists</h4>${ex}
      <h4 class="pick" style="border:none;margin:16px 0 6px">Theme</h4><div class="seg">${theme}</div>
      <p class="small muted" style="margin-top:16px">Lists are saved in this browser only. Use “Back up all” or the Roster tab to keep a copy. Data: ${esc(GAME.version)}.</p>` };
  }

  function importModal() {
    const head = `<div class="top"><h2>Import</h2><button class="btn" data-act="close">Close</button></div>`;
    const body = `<p class="small muted">Paste a list — a NewRecruit text export, or anything exported from Supply Line (text roster, JSON, backup file or share link).</p>
      <textarea id="importText" rows="10" style="width:100%;font:13px ui-monospace,Consolas,monospace" placeholder="Paste here…"></textarea>
      <div class="btnrow" style="margin-top:8px"><button class="btn primary" data-act="do-import">Import</button>
      <label class="btn" style="cursor:pointer">Open file…<input type="file" id="importFile" accept=".json,.txt,application/json,text/plain" data-act="import-file" hidden></label></div>`;
    return { head, body };
  }

  function importText(text) {
    text = String(text || '').trim();
    if (!text) { toast('Nothing to import'); return; }
    const added = [];
    try {
      const hm = text.match(/#l=([\w-]+)/);
      if (hm) added.push(E.decodeShare(hm[1]));
      else if (/^[[{]/.test(text)) {
        const o = JSON.parse(text);
        const arr = Array.isArray(o) ? o : Array.isArray(o.lists) ? o.lists : [o];
        arr.forEach(x => added.push(E.normalize({ ...x, id: undefined })));
      } else added.push(E.fromText(text));
    } catch (e) { toast('Could not read that — ' + e.message); return; }
    added.forEach(x => { x.id = E.uid(); store.lists.unshift(x); });
    store.current = added[0].id; ui.modal = null; ui.open.clear(); persist(); render();
    toast(added.length > 1 ? `Imported ${added.length} lists` : `Imported “${added[0].name}”`);
  }

  // ── render ──
  function render() {
    hideTip();
    const l = cur(), ev = E.evaluate(l);
    document.documentElement.dataset.race = l.race;
    const nm = $('#listName'); if (document.activeElement !== nm) nm.value = l.name;
    $('#bar').innerHTML = renderBar(l, ev);
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === ui.tab)));
    const views = { army: renderArmy, build: renderBuild, play: renderPlay, plan: renderPlan, roster: renderRoster };
    $('#view').innerHTML = (views[ui.tab] || renderBuild)(l, ev);
    renderModal(l, ev);
    document.title = `${l.name} — Supply Line`;
  }

  // ── actions ──
  const findEntry = uid => cur().units.find(u => u.uid === uid);
  const A = {
    tab: t => { ui.tab = store.tab = t.dataset.tab; persist(); render(); window.scrollTo(0, 0); },
    'goto-problems': () => { ui.tab = 'build'; render(); const p = $('#problems'); if (p) p.scrollIntoView({ behavior: 'smooth', block: 'center' }); },
    race: t => {
      const r = t.dataset.race, l = cur();
      if (r === l.race) return;
      const hasStuff = l.units.length || l.cards.some(id => E.cards[id] && E.cards[id].kind !== 'creep');
      if (hasStuff && !confirm(`Switch to ${GAME.races[r].name}? This clears the units and cards in “${l.name}”.`)) return;
      commit(x => { x.race = r; x.faction = ''; x.units = []; x.deploy = {}; x.cards = GAME.races[r].needsCreep ? ['creep-accel'] : []; });
    },
    scale: t => commit(l => { l.scale = t.dataset.scale; }),
    toggle: t => { const id = t.dataset.uid; ui.open.has(id) ? ui.open.delete(id) : ui.open.add(id); render(); },
    'army-toggle': t => {
      const k = t.dataset.key;
      ui.armyOpen = ui.armyOpen === k ? null : k;
      render();
      const el = ui.armyOpen && [...document.querySelectorAll('.dcard[data-key]')].find(c => c.dataset.key === k);
      if (el) el.scrollIntoView({ block: 'start' });
    },
    size: t => commit(() => { findEntry(t.dataset.uid).n = Number(t.dataset.n); }),
    up: t => commit(() => E.toggleUpgrade(findEntry(t.dataset.uid), t.dataset.up)),
    dup: t => commit(l => { const e = findEntry(t.dataset.uid); const c = { ...e, uid: E.uid(), up: [...e.up] }; l.units.splice(l.units.indexOf(e) + 1, 0, c); }),
    remove: t => commit(l => { l.units = l.units.filter(u => u.uid !== t.dataset.uid); delete l.deploy[t.dataset.uid]; ui.open.delete(t.dataset.uid); }),
    picker: () => { ui.modal = 'picker'; ui.q = ''; ui.peek = null; render(); setTimeout(() => { const q = $('#pickQ'); if (q && matchMedia('(min-width:700px)').matches) q.focus(); }, 0); },
    cardpicker: () => { ui.modal = 'cardpicker'; ui.peek = null; render(); },
    lists: () => { ui.modal = 'lists'; render(); },
    import: () => { ui.modal = 'import'; render(); },
    close: () => { ui.modal = null; render(); },
    'close-bg': (t, e) => { if (e.target === t) { ui.modal = null; render(); } },
    'pick-filter': t => { ui.filter = t.dataset.f; render(); },
    peek: t => { ui.peek = ui.peek === t.dataset.id ? null : t.dataset.id; render(); },
    add: t => { let lbl; commit(l => { const e = E.addUnit(l, t.dataset.id, Number(t.dataset.n)); lbl = E.entry(e).label; }); toast(`Added ${lbl}`); },
    'add-card': t => { commit(l => { l.cards.push(t.dataset.id); }); toast(`Added ${E.cards[t.dataset.id].name}`); },
    'card-inc': t => commit(l => { l.cards.push(t.dataset.id); }),
    'card-dec': t => commit(l => { const i = l.cards.lastIndexOf(t.dataset.id); if (i >= 0) l.cards.splice(i, 1); }),
    'card-remove': t => commit(l => { l.cards = l.cards.filter(id => id !== t.dataset.id); }),
    'card-toggle': t => { const id = t.dataset.id; ui.openCards.has(id) ? ui.openCards.delete(id) : ui.openCards.add(id); render(); },
    creep: t => commit(l => { l.cards = l.cards.filter(id => !(E.cards[id] && E.cards[id].kind === 'creep')); l.cards.unshift(t.dataset.id); }),
    use: t => commit(l => { const k = t.dataset.key; if (l.used[k]) delete l.used[k]; else l.used[k] = true; }),
    'new-round': () => { commit(l => { l.used = {}; l.round += 1; }); toast(`Round ${cur().round} — all cards ready`); },
    'reset-round': () => { commit(l => { l.used = {}; l.round = 1; }); toast('Back to Round 1 — all cards ready'); },
    deploy: t => commit(l => { const r = Number(t.dataset.r); if (r) l.deploy[t.dataset.uid] = r; else delete l.deploy[t.dataset.uid]; }),
    autoplan: () => commit(l => { l.deploy = E.autoPlan(l); }),
    clearplan: () => commit(l => { l.deploy = {}; }),
    copytext: () => copy(rosterText(cur())),
    'roster-fmt': t => { store.rosterFmt = t.dataset.f; persist(); render(); },
    sharelink: () => {
      const base = location.href.split('#')[0];
      copy(`${base}#l=${E.encodeShare(cur())}`);
    },
    'dl-txt': () => download(`${fileSafe(cur().name)}${rosterFmt() === 'nr' ? '-newrecruit' : ''}.txt`, rosterText(cur())),
    'dl-json': () => download(`${fileSafe(cur().name)}.json`, JSON.stringify(cur(), null, 2), 'application/json'),
    'export-all': () => download(`supply-line-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: 'supply-line', lists: store.lists }, null, 2), 'application/json'),
    print: () => { const l = cur(); $('#print').innerHTML = printView(l, E.evaluate(l)); window.print(); },
    'new-list': t => { ui.modal = null; ui.tab = 'build'; addList(E.newList({ race: t.dataset.race, name: `New ${GAME.races[t.dataset.race].name} list` }), 'New list created'); },
    'open-list': t => { store.current = t.dataset.id; ui.modal = null; ui.open.clear(); persist(); render(); },
    'copy-list': t => { const src = store.lists.find(x => x.id === t.dataset.id); const c = E.normalize({ ...JSON.parse(JSON.stringify(src)), id: E.uid(), name: src.name + ' (copy)' }); ui.modal = null; addList(c, 'List copied'); },
    'delete-list': t => {
      const x = store.lists.find(z => z.id === t.dataset.id);
      if (!confirm(`Delete “${x.name}”? This can't be undone.`)) return;
      store.lists = store.lists.filter(z => z.id !== x.id);
      if (!store.lists.length) store.lists.push(E.newList({ name: 'New list' }));
      if (store.current === x.id) store.current = store.lists[0].id;
      persist(); render();
    },
    example: t => { const x = E.example(Number(t.dataset.i)); x.id = E.uid(); ui.modal = null; ui.tab = 'build'; addList(x, `Loaded “${x.name}”`); },
    theme: t => { store.theme = t.dataset.t; persist(); applyTheme(); render(); },
    'do-import': () => importText($('#importText').value),
  };
  const CHANGE = {
    faction: t => commit(l => { l.faction = t.value; if (GAME.races[l.race].needsCreep && !l.cards.some(id => E.cards[id] && E.cards[id].kind === 'creep')) l.cards.unshift('creep-accel'); }),
    limit: t => commit(l => { l.limit = Math.max(0, Number(t.value) || GAME.scales.grand.limit); }),
    mission: t => commit(l => { l.mission = t.value; }),
    rename: t => commit(l => { l.name = t.value.trim() || 'Untitled list'; }),
    'import-file': t => { const f = t.files && t.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => importText(r.result); r.readAsText(f); },
  };
  // Keywords: a mouse shows the popup on hover; a tap (or click) toggles it; Tab focus shows it too.
  document.addEventListener('pointerdown', e => { const k = e.target.closest('[data-kw]'); tapWasOpen = !!k && k === tipFor; }, true);
  document.addEventListener('pointerover', e => { if (e.pointerType !== 'mouse') return; const k = e.target.closest('[data-kw]'); if (k && k !== tipFor) showTip(k); });
  document.addEventListener('pointerout', e => { if (e.pointerType === 'mouse' && tipFor && e.target.closest('[data-kw]') === tipFor && !tipFor.contains(e.relatedTarget)) hideTip(); });
  document.addEventListener('focusin', e => { const k = e.target.closest && e.target.closest('[data-kw]'); if (k) showTip(k); });
  document.addEventListener('focusout', e => { if (e.target === tipFor) hideTip(); });
  window.addEventListener('scroll', () => { if (tipFor) hideTip(); }, { passive: true });
  document.addEventListener('click', e => {
    const kw = e.target.closest('[data-kw]');
    if (kw) { if (tapWasOpen && e.pointerType !== 'mouse') hideTip(); else showTip(kw); return; }
    if (tipFor) hideTip();
    const t = e.target.closest('[data-act]');
    if (!t || !A[t.dataset.act] || t.tagName === 'SELECT' || t.tagName === 'INPUT') return;
    A[t.dataset.act](t, e);
  });
  document.addEventListener('change', e => { const t = e.target.closest('[data-act]'); if (t && CHANGE[t.dataset.act]) CHANGE[t.dataset.act](t, e); });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.act === 'pick-q') { ui.q = t.value; render(); }
    if (t.dataset.act === 'rename') { cur().name = t.value; persist(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && tipFor) { hideTip(); return; }
    if (e.key === 'Escape' && ui.modal) { ui.modal = null; render(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('header[data-act="toggle"],header[data-act="army-toggle"]')) { e.preventDefault(); A[e.target.dataset.act](e.target); }
    if (e.key === 'Enter' && e.target.id === 'listName') e.target.blur();
  });
  window.addEventListener('storage', e => { if (e.key === KEY) { store = load(); render(); } });

  // ── boot ──
  const topEl = $('#top');
  const syncTop = () => document.documentElement.style.setProperty('--toph', topEl.offsetHeight + 'px');
  if (window.ResizeObserver) new ResizeObserver(syncTop).observe(topEl); else window.addEventListener('resize', syncTop);
  syncTop();
  ui.tab = ['army', 'build', 'play', 'plan', 'roster'].includes(store.tab) ? store.tab : (cur().units.length ? 'army' : 'build');
  $('#dataver').textContent = `Data: ${GAME.version}. Supply Line is free, has no ads, and keeps your lists in this browser.`;
  applyTheme();
  const hm = location.hash.match(/^#l=([\w-]+)/);
  if (hm) {
    try { const x = E.decodeShare(hm[1]); x.id = E.uid(); x.name = x.name || 'Shared list'; store.lists.unshift(x); store.current = x.id; persist(); setTimeout(() => toast(`Opened shared list “${x.name}”`), 50); }
    catch (e) { setTimeout(() => toast('That share link is broken'), 50); }
    history.replaceState(null, '', location.pathname + location.search);
  }
  render();
  syncTop();
})();
</script>
</body>
</html>
